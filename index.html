<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>אביחי משימות</title>
<meta name="theme-color" content="#FAF9F7"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="משימות"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{
  --bg:#FAF9F7;--panel:#FFFFFF;--rail:#F1EFEC;--rail2:#F4F2EE;
  --rule:#1418240F;--rule2:#1418241F;
  --ink:#14181C;--ink2:#5A6470;--ink3:#9099A3;
  --accent:#3F6FB5;--accentSoft:#E5EDF7;
  --red:#B23D3D;--redSoft:#F7E5E5;
  --amber:#9C6A1F;--amberSoft:#F6EBD7;
  --green:#3D7A4F;--greenSoft:#E2EEE5;
  --r:6px;--row-pad-y:9px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#15171A;--panel:#1C1F22;--rail:#191B1E;--rail2:#1F2226;
    --rule:#FFFFFF12;--rule2:#FFFFFF24;
    --ink:#E7E9EC;--ink2:#A0A8B2;--ink3:#6E7681;
    --accentSoft:#1E2C42;--redSoft:#3A1E1E;--amberSoft:#36280F;--greenSoft:#16291C;
  }
}
body{
  font-family:'IBM Plex Sans Hebrew',system-ui,-apple-system,sans-serif;
  direction:rtl;color:var(--ink);background:var(--bg);
  overflow:hidden;font-size:13px;line-height:1.5;
}
button,input,textarea,select{font-family:inherit;color:inherit}
input,textarea,select{outline:none}
button{background:none;border:none;cursor:pointer;font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

#root{display:flex;height:100vh;overflow:hidden}

/* ===== SIDEBAR ===== */
#sb{width:230px;flex-shrink:0;background:var(--rail);border-left:.5px solid var(--rule);display:flex;flex-direction:column}
.sb-user{padding:12px 14px;border-bottom:.5px solid var(--rule);display:flex;align-items:center;gap:9px}
.sb-av{width:26px;height:26px;background:var(--ink);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:13px;font-weight:700;flex-shrink:0}
.sb-uinfo{min-width:0;flex:1}
.sb-uname{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-utitle{font-size:10.5px;color:var(--ink2);margin-top:1px}
.sb-search{padding:10px 12px}
.sb-search-box{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--panel);border:.5px solid var(--rule);border-radius:5px;font-size:12px;color:var(--ink3);cursor:pointer}
.sb-search-box input{flex:1;background:transparent;border:none;font-size:12px;color:var(--ink);min-width:0}
.sb-search-box input::placeholder{color:var(--ink3)}
.sb-search-kbd{font-family:var(--mono);font-size:10px;color:var(--ink3);padding:1px 5px;background:var(--rail);border-radius:3px}
.sb-nav{padding:4px 8px;display:flex;flex-direction:column;gap:1px}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:7px 9px;font-size:13px;color:var(--ink);background:transparent;border-radius:4px;text-align:right;font-weight:600}
.nav-item:hover{background:var(--rail2)}
.nav-item.act{color:var(--ink);background:var(--panel);font-weight:700;box-shadow:inset 0 0 0 .5px var(--rule2)}
.nav-item .ic{display:flex;align-items:center;flex-shrink:0}
.nav-item .cnt{font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:3px;color:var(--ink2);background:var(--rail);font-weight:600}
.nav-item .cnt.red{background:var(--redSoft);color:var(--red)}
.sb-section{padding:14px 14px 6px;font-size:10px;color:var(--ink3);letter-spacing:.14em;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.sb-section .add{font-size:14px;cursor:pointer;color:var(--ink3);padding:2px 6px;border-radius:3px}
.sb-section .add:hover{color:var(--ink);background:var(--rail2)}
.sb-projects{flex:1;overflow-y:auto;padding:0 8px}
.proj-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 8px;font-size:12.5px;color:var(--ink2);font-weight:500;border-radius:4px;text-align:right;cursor:pointer}
.proj-item:hover{background:var(--rail2)}
.proj-item.act{color:var(--ink);background:var(--panel);font-weight:600}
.proj-left{display:flex;gap:9px;align-items:center;min-width:0;flex:1}
.proj-dot{width:10px;height:10px;border-radius:3px;background:var(--ink3);flex-shrink:0;cursor:pointer;border:1px solid transparent;transition:transform .12s}
.proj-dot:hover{transform:scale(1.3);border-color:var(--ink2)}
.proj-item.act .proj-dot{background:var(--accent)}
.proj-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-cnt{font-size:10px;color:var(--ink3);font-family:var(--mono);flex-shrink:0;margin-right:6px}
.proj-areas{padding-right:14px;margin-top:2px;margin-bottom:6px;display:flex;flex-direction:column;gap:1px}
.area-item{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;font-size:11.5px;color:var(--ink2);border-radius:3px;cursor:pointer;gap:5px}
.area-item:hover{background:var(--rail2)}
.area-item.act{color:var(--ink);font-weight:500;background:var(--rail2)}
.area-edit-btn{font-size:11px;color:var(--ink3);padding:1px 5px;border-radius:3px;opacity:0;transition:opacity .12s;cursor:pointer}
.area-item:hover .area-edit-btn{opacity:1}
.area-edit-btn:hover{color:var(--ink);background:var(--panel)}
.area-add{color:var(--ink3);font-style:italic}
.area-cnt{font-size:10px;color:var(--ink3);font-family:var(--mono);flex-shrink:0}
.proj-item[draggable="true"]{cursor:grab}
.proj-item.dragging,.area-item.dragging{opacity:.4}
.proj-item.drop-target,.area-item.drop-target{background:var(--greenSoft)!important;color:var(--green)!important}
.proj-item.drop-before{box-shadow:inset 0 2px 0 0 var(--accent)}
.proj-item.drop-after{box-shadow:inset 0 -2px 0 0 var(--accent)}
.sb-foot{padding:10px;border-top:.5px solid var(--rule);display:flex;align-items:center;gap:9px}
.sb-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sb-foot .dot.off{background:var(--red)}
.sb-foot .lbl{font-size:11px;color:var(--ink2);flex:1}
.sb-foot .ver{font-size:10px;color:var(--ink3);font-family:var(--mono)}
.sb-actions{padding:8px 10px;border-top:.5px solid var(--rule);display:flex;flex-direction:column;gap:5px}
.sb-btn{font-size:11.5px;padding:5px 9px;border-radius:4px;border:.5px solid var(--rule2);background:var(--panel);color:var(--ink2);text-align:center}
.sb-btn:hover{background:var(--rail2);color:var(--ink)}
.sb-btn-row{display:flex;gap:5px}
.sb-btn-row .sb-btn{flex:1}
.sb-btn-ai{font-size:12px;padding:6px 9px;border-radius:4px;background:var(--ink);color:var(--bg);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;border:none}
.sb-btn-ai:hover{opacity:.88}

/* ===== MAIN ===== */
#mn{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.mn-h{padding:14px 22px 0;border-bottom:.5px solid var(--rule)}
.mn-crumb{font-size:11.5px;color:var(--ink2);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.mn-crumb .sep{color:var(--ink3)}
.mn-crumb .cur{color:var(--ink)}
.mn-h-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:14px}
.mn-h-l h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.mn-h-meta{display:flex;gap:14px;margin-top:6px;font-size:11.5px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.mn-h-code{font-family:var(--mono);color:var(--accent);font-weight:600;font-size:11px}
.mn-h-actions{display:flex;gap:7px}
.btn-ghost{font-size:12px;padding:6px 10px;background:var(--panel);border:.5px solid var(--rule2);border-radius:4px;color:var(--ink2)}
.btn-ghost:hover{background:var(--rail2);color:var(--ink)}
.btn-primary{font-size:12px;padding:6px 10px;background:var(--ink);border:none;border-radius:4px;color:var(--bg);font-weight:500;display:flex;align-items:center;gap:5px}
.btn-primary:hover{opacity:.88}
.btn-accent{font-size:12px;padding:6px 12px;background:var(--accent);border:none;border-radius:4px;color:#fff;font-weight:500}
.btn-accent:hover{opacity:.88}
.btn-danger{color:var(--red);border-color:#F0959580}

/* KPI cards */
.kpis{padding:14px 22px 0;display:flex;gap:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:140px;background:var(--panel);border:.5px solid var(--rule);border-radius:6px;padding:12px 14px;border-right:.5px solid var(--rule);text-align:right}
.kpi.acc-r{border-right:2px solid var(--red)}
.kpi.acc-g{border-right:2px solid var(--green)}
.kpi.acc-a{border-right:2px solid var(--amber)}
.kpi-btn{cursor:pointer;font-family:inherit;transition:transform .12s,box-shadow .12s}
.kpi-btn:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06);border-color:var(--rule2)}
.kpi-btn:active{transform:translateY(0)}
.sec-head.pri-urgent{color:var(--red)!important;font-weight:700}
.sec-head.pri-urgent .cnt{background:var(--redSoft);color:var(--red);padding:1px 6px;border-radius:3px}
.sec-head.pri-med{color:var(--amber)!important}
.kpi-l{font-size:10.5px;color:var(--ink3);letter-spacing:.1em;font-weight:600;margin-bottom:6px}
.kpi-row{display:flex;align-items:baseline;gap:8px}
.kpi-v{font-size:24px;font-weight:600;color:var(--ink);font-feature-settings:"tnum";line-height:1}
.kpi.acc-r .kpi-v{color:var(--red)}
.kpi.acc-g .kpi-v{color:var(--green)}
.kpi.acc-a .kpi-v{color:var(--amber)}
.kpi-s{font-size:11px;color:var(--ink3)}

/* Toolbar */
.tlb{padding:14px 22px 10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip-filter{font-size:11.5px;padding:5px 10px;background:var(--panel);border:.5px solid var(--rule2);border-radius:4px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.chip-filter:hover{background:var(--rail2)}
.chip-filter.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);font-weight:500}
.chip-wrap{display:inline-flex;align-items:stretch;gap:0}
.chip-wrap .chip-filter{border-radius:4px 0 0 4px;border-left:none}
.chip-wrap .chip-filter:not(.on){border-radius:4px}
.chip-edit-btn{font-size:11px;padding:5px 7px;background:var(--accentSoft);border:.5px solid var(--accent);border-right:none;border-radius:0 4px 4px 0;color:var(--accent);cursor:pointer}
.chip-edit-btn:hover{background:var(--accent);color:#fff}
.tlb-divider{height:18px;width:1px;background:var(--rule2)}
.tlb-grow{margin-right:auto}
.tlb-lbl{font-size:11px;color:var(--ink3)}
.tlb-sel{font-size:11.5px;padding:5px 10px;background:var(--panel);border:.5px solid var(--rule2);border-radius:4px;color:var(--ink2)}

/* Task table */
.tl-wrap{flex:1;overflow-y:auto;padding:0 22px 22px}
.tl{background:var(--panel);border:.5px solid var(--rule);border-radius:6px;overflow:hidden}

/* Dashboard */
.dash-body{flex:1;overflow-y:auto;padding:14px 22px 22px}
.dash-section-title{display:flex;align-items:center;gap:10px;padding:10px 0 10px;font-size:13px;font-weight:600;color:var(--ink)}
.dash-section-cnt{font-size:11px;color:var(--ink3);font-family:var(--mono);background:var(--rail2);padding:1px 8px;border-radius:99px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:6px}
.dash-card{background:var(--panel);border:.5px solid var(--rule);border-radius:7px;padding:13px 14px;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;gap:8px}
.dash-card:hover{border-color:var(--rule2);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.dash-card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dash-card-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dash-card-name{font-size:14px;font-weight:600;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dash-card-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;font-family:var(--mono)}
.dash-card-badge.urgent{background:var(--redSoft);color:var(--red)}
.dash-card-badge.overdue{background:var(--amberSoft);color:var(--amber)}
.dash-card-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 0 2px}
.dash-stat{display:flex;flex-direction:column;align-items:center;gap:1px}
.dash-stat-v{font-size:18px;font-weight:600;color:var(--ink);font-feature-settings:"tnum";line-height:1}
.dash-stat-l{font-size:10px;color:var(--ink3);letter-spacing:.04em}
.dash-card-bar{width:100%;height:4px;background:var(--rail2);border-radius:99px;overflow:hidden}
.dash-card-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.dash-card-foot{display:flex;justify-content:space-between;align-items:center}
.tl-head{display:grid;grid-template-columns:22px 1fr 100px 100px 70px 24px;gap:14px;padding:7px 16px;background:var(--rail2);border-bottom:.5px solid var(--rule);font-size:10px;color:var(--ink3);letter-spacing:.1em;font-weight:600}
.sec-head{width:100%;padding:8px 16px;background:var(--rail2);border-top:.5px solid var(--rule);border-bottom:.5px solid var(--rule);font-size:11.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;text-align:right}
.sec-head .chev{color:var(--ink3);transition:transform .15s}
.sec-head.col .chev{transform:rotate(-90deg)}
.sec-head .cnt{color:var(--ink3);font-weight:400;font-family:var(--mono)}
.sec-head .ic-add{margin-right:auto;color:var(--ink3);padding:0 4px;font-size:14px;cursor:pointer;border-radius:3px}
.sec-head .ic-add:hover{color:var(--ink);background:var(--rail)}
.sec-head[ondragover]{transition:background .12s}
.sec-head.drop-target{background:var(--greenSoft);color:var(--green)}
.tr{display:grid;grid-template-columns:22px 1fr 100px 100px 70px 24px;align-items:center;padding:var(--row-pad-y) 16px;gap:14px;border-bottom:.5px solid var(--rule);background:var(--panel);cursor:pointer}
.tr:hover{background:var(--rail2)}
.tr.sel{background:var(--accentSoft)}
.tr.done{opacity:.55}
.tr-title-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.tr-title{font-size:13.5px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1;min-width:0}
.tr.done .tr-title{text-decoration:line-through}
.imp-tag{font-size:10px;font-weight:600;color:var(--amber);padding:1px 5px;border:.5px solid var(--amber);border-radius:2px;flex-shrink:0;letter-spacing:.04em}
.tr-area,.tr-proj{font-size:11px;color:var(--ink3);flex-shrink:0;white-space:nowrap}
.tr-proj{font-family:var(--mono)}
.tr-due{font-size:11.5px;color:var(--ink2);font-feature-settings:"tnum";white-space:nowrap}
.tr-due.od{color:var(--red);font-weight:600}
.tr-more{color:var(--ink3);font-size:13px;text-align:center;border-radius:3px;padding:2px 0}
.tr-more:hover{color:var(--ink);background:var(--rail)}
.tl-add{padding:9px 16px;font-size:12px;color:var(--ink3);border-top:.5px solid var(--rule);cursor:pointer}
.tl-add:hover{color:var(--ink);background:var(--rail2)}
.empty-st{padding:60px 0;text-align:center;color:var(--ink3);font-size:13px;line-height:2}
.tr[draggable="true"]{cursor:pointer}
.tr.dragging{opacity:.35}

/* Checkbox */
.cb{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--ink3);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;cursor:pointer;transition:all .12s}
.cb:hover{border-color:var(--ink2)}
.cb.done{background:var(--green);border-color:var(--green)}
.cb.done::after{content:"✓";color:#fff;font-size:9px;font-weight:700;line-height:1}

/* Chips */
.chip-st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:3px;border:.5px solid;white-space:nowrap}
.chip-st.s-open{color:var(--ink2);border-color:var(--rule2);background:var(--panel)}
.chip-st.s-prog{color:var(--accent);border-color:var(--accent);background:var(--accentSoft)}
.chip-st.s-wait{color:var(--amber);border-color:var(--amber);background:var(--amberSoft)}
.chip-st.s-done{color:var(--green);border-color:var(--green);background:var(--greenSoft)}
.chip-pr{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 7px;border-radius:3px;white-space:nowrap}
.chip-pr-dot{width:5px;height:5px;border-radius:50%}
.chip-pr.p-r{background:var(--redSoft);color:var(--red)}
.chip-pr.p-r .chip-pr-dot{background:var(--red)}
.chip-pr.p-a{background:var(--amberSoft);color:var(--amber)}
.chip-pr.p-a .chip-pr-dot{background:var(--amber)}
.chip-pr.p-l{background:var(--rail2);color:var(--ink2)}
.chip-pr.p-l .chip-pr-dot{background:var(--ink3)}
.chip-em{font-size:11px;color:var(--ink3)}
.chip-as{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 7px;border-radius:3px;background:var(--accentSoft);color:var(--accent)}

/* ===== DETAIL PANEL ===== */
#dp{width:360px;flex-shrink:0;background:var(--panel);border-right:.5px solid var(--rule);display:flex;flex-direction:column;animation:slidein .22s cubic-bezier(.2,.7,.3,1);overflow-y:auto}
@keyframes slidein{from{transform:translateX(-12px);opacity:0}to{transform:translateX(0);opacity:1}}
.dp-h{padding:12px 16px;border-bottom:.5px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
.dp-crumb{font-size:11px;color:var(--ink2);font-family:var(--mono)}
.dp-h-actions{display:flex;gap:4px}
.dp-h-btn{padding:6px;color:var(--ink3);border-radius:4px;display:flex;align-items:center}
.dp-h-btn:hover{background:var(--rail2);color:var(--ink)}
.dp-h-btn.del:hover{color:var(--red)}
.dp-title-wrap{padding:16px 18px 12px}
.dp-title{width:100%;font-size:18px;font-weight:600;color:var(--ink);background:transparent;border:none;direction:rtl;line-height:1.3;padding:4px 0;letter-spacing:-.01em}
.dp-fields{padding:0 18px 14px;display:flex;flex-direction:column;gap:12px}
.f-l{font-size:10.5px;color:var(--ink3);letter-spacing:.06em;font-weight:600;margin-bottom:5px;text-transform:uppercase}
.opt-grp{display:flex;gap:5px;flex-wrap:wrap}
.opt{font-size:11.5px;padding:4px 10px;border-radius:3px;border:.5px solid var(--rule2);background:var(--panel);color:var(--ink2);font-weight:400}
.opt:hover{background:var(--rail2)}
.opt.act{font-weight:600}
.opt.act-acc{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}
.opt.act-r{border-color:var(--red);background:var(--redSoft);color:var(--red)}
.opt.act-a{border-color:var(--amber);background:var(--amberSoft);color:var(--amber)}
.opt.act-l{border-color:var(--ink3);background:var(--rail2);color:var(--ink)}
.opt.act-g{border-color:var(--green);background:var(--greenSoft);color:var(--green)}
.opt.act-ink{border-color:var(--ink);background:var(--rail2);color:var(--ink)}
.opt.add{color:var(--ink3);border-style:dashed}
.opt.add:hover{color:var(--ink);border-color:var(--ink)}
.dp-input{width:100%;font-size:12.5px;padding:6px 10px;border-radius:4px;border:.5px solid var(--rule2);background:var(--panel);color:var(--ink);direction:rtl}
.dp-input:focus{border-color:var(--ink2)}
.dp-input[type="date"]{direction:ltr}
.dp-textarea{width:100%;font-size:12.5px;padding:7px 10px;border-radius:4px;border:.5px solid var(--rule2);background:var(--panel);color:var(--ink);direction:rtl;min-height:60px;resize:vertical;font-family:inherit;line-height:1.5}
.dp-textarea:focus{border-color:var(--ink2)}
.rt-tools{display:flex;gap:2px;padding:4px 6px;border:.5px solid var(--rule2);border-bottom:none;border-radius:4px 4px 0 0;background:var(--rail2)}
.rt-btn{font-size:12px;padding:3px 8px;color:var(--ink2);border-radius:3px;min-width:24px}

.rt-content{min-height:90px;max-height:180px;overflow-y:auto;padding:8px 11px;border:.5px solid var(--rule2);border-radius:0 0 4px 4px;background:var(--panel);color:var(--ink);direction:rtl;text-align:right;font-size:12.5px;line-height:1.55;outline:none}

.rt-content ul,.rt-content ol{padding-right:22px;margin:4px 0}
.rt-content b,.rt-content strong{font-weight:700}
.dp-act{padding:12px 18px;border-top:.5px solid var(--rule);margin-top:auto;display:flex;flex-direction:column;gap:7px}
.dp-act-l{font-size:10px;color:var(--ink3);letter-spacing:.1em;font-weight:600;margin-bottom:4px}

.act-row .ic{color:var(--ink3);display:flex;align-items:center}
.act-row .lbl{flex:1}
.act-row .v{color:var(--ink);font-feature-settings:"tnum"}
.gcal-link{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:5px 10px;border-radius:4px;border:.5px solid var(--rule2);background:var(--panel);color:var(--ink2);text-decoration:none}

.gcal-link.dis{opacity:.6;pointer-events:none;cursor:not-allowed}
.gcal-btn{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:5px 10px;border-radius:4px;border:.5px solid var(--rule2);background:var(--panel);color:var(--ink2);cursor:pointer;font-family:inherit}
.gcal-btn:hover{background:var(--accentSoft);color:var(--accent);border-color:var(--accent)}
.gcal-btn.synced{background:var(--greenSoft);color:var(--green);border-color:var(--green)}
.gcal-btn.synced:hover{background:var(--accentSoft);color:var(--accent);border-color:var(--accent)}
.gcal-btn.remove:hover{background:var(--redSoft);color:var(--red);border-color:var(--red)}
.dp-foot-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.area-pop{position:relative;display:inline-block}
.area-pop-menu{position:absolute;background:var(--panel);border:.5px solid var(--rule2);border-radius:4px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:50;min-width:140px;top:calc(100% + 4px);right:0}
.area-pop-i{display:block;width:100%;text-align:right;padding:6px 10px;font-size:12px;color:var(--ink);border-radius:3px;direction:rtl}

/* ===== NOTES VIEW ===== */
.notes-add{padding:14px 22px 8px;display:flex;gap:8px}
.notes-add input{flex:1;font-size:13px;padding:8px 12px;border:.5px solid var(--rule2);border-radius:4px;background:var(--panel);color:var(--ink);direction:rtl}
.notes-add input:focus{border-color:var(--ink2)}
.notes-list{flex:1;overflow-y:auto;padding:8px 22px 22px;display:flex;flex-direction:column;gap:9px}
.note{background:var(--panel);border:.5px solid var(--rule);border-radius:6px;overflow:hidden;flex-shrink:0}
.note:hover{border-color:var(--rule2)}
.note.dragging{opacity:.4}
.note.done{opacity:.55}
.note-row{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:grab;min-height:44px}
.note-input{flex:1;font-size:13.5px;background:transparent;border:none;color:var(--ink);direction:rtl;min-width:0;padding:3px 5px;border-radius:3px;font-weight:500}
.note-input:focus{background:var(--rail2)}
.note.done .note-input{text-decoration:line-through;color:var(--ink2)}
.note-tg{padding:5px 9px;color:var(--ink3);font-size:12px;border-radius:3px;transition:transform .15s}
.note-tg:hover{color:var(--ink);background:var(--rail2)}
.note-tg.open{transform:rotate(180deg)}
.note-tg.has{color:var(--accent)}
.note-x{padding:6px;color:var(--ink3);border-radius:3px;display:flex;align-items:center}
.note-x:hover{color:var(--red);background:var(--redSoft)}
.note-extra{display:none;padding:10px 14px 14px;border-top:.5px solid var(--rule);background:var(--rail2)}
.note-extra.open{display:block}
.note-rt-tools{display:flex;gap:2px;padding:5px 7px;border:.5px solid var(--rule2);border-bottom:none;border-radius:5px 5px 0 0;background:var(--panel);flex-wrap:wrap}
.note-rt-btn{font-size:13px;padding:4px 9px;color:var(--ink2);border-radius:3px;min-width:28px;font-family:inherit;cursor:pointer;background:transparent;border:none}
.note-rt-btn:hover{background:var(--rail2);color:var(--ink)}
.note-rt-btn.sz-input{padding:0;width:55px;display:flex;align-items:center}
.note-rt-btn select{font-size:12px;padding:3px 4px;border:.5px solid var(--rule);border-radius:3px;background:var(--bg);color:var(--ink);width:100%;font-family:inherit;cursor:pointer}
.note-rt-color{width:22px;height:22px;border:1px solid var(--rule2);border-radius:3px;cursor:pointer;padding:0;background:transparent;position:relative}
.note-rt-color::after{content:"A";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink)}
.note-rt-color.bg::after{content:"";background:linear-gradient(135deg,#FFE4B5 50%,transparent 50%)}
.note-content{width:100%;padding:11px 13px;border:.5px solid var(--rule2);border-radius:0 0 5px 5px;background:var(--panel);color:var(--ink);direction:rtl;text-align:right;font-size:13px;line-height:1.65;outline:none;min-height:120px;max-height:none;overflow:visible;font-family:inherit}
.note-content:focus{border-color:var(--ink2)}
.note-content:empty:before{content:attr(data-placeholder);color:var(--ink3);pointer-events:none}
.note-content ul,.note-content ol{padding-right:24px;margin:6px 0}
.note-content b,.note-content strong{font-weight:700}
.note-content i,.note-content em{font-style:italic}
.note-content u{text-decoration:underline}
.note-content h1,.note-content h2,.note-content h3{font-weight:700;margin:8px 0 4px}
.note-content h1{font-size:18px}
.note-content h2{font-size:16px}
.note-content h3{font-size:14px}
.notes-sep{font-size:10px;color:var(--ink3);padding:14px 4px 6px;letter-spacing:.1em;font-weight:600;flex-shrink:0}

/* ===== NOTE CANVAS (handwriting) ===== */
.note-canvas-section{margin-top:10px;border:.5px solid var(--rule2);border-radius:6px;background:#FFFFFF;overflow:hidden}
[data-dark="true"] .note-canvas-section,.note-canvas-section{--canvas-bg:#FFFFFF}

.note-canvas-toolbar{display:flex;align-items:center;gap:5px;padding:6px 8px;background:var(--rail2);border-bottom:.5px solid var(--rule2);flex-wrap:wrap}
.note-canvas-tool{font-size:14px;padding:5px 9px;color:var(--ink2);border-radius:4px;cursor:pointer;background:transparent;border:.5px solid transparent;font-family:inherit;min-width:30px;display:inline-flex;align-items:center;justify-content:center}
.note-canvas-tool:hover{background:var(--panel);color:var(--ink);border-color:var(--rule2)}

.note-canvas-tool svg{width:14px;height:14px}
.note-canvas-divider{width:1px;height:20px;background:var(--rule2);margin:0 2px}
.note-canvas-colors{display:flex;gap:4px;align-items:center}
.note-canvas-color{width:22px;height:22px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;padding:0;transition:transform .12s;flex-shrink:0}
.note-canvas-color:hover{transform:scale(1.15)}
.note-canvas-color.act{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--ink)}
.note-canvas-sizes{display:flex;gap:3px;align-items:center}
.note-canvas-size{width:30px;height:24px;border-radius:4px;cursor:pointer;border:.5px solid var(--rule2);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);padding:0}
.note-canvas-size:hover{border-color:var(--ink2);color:var(--ink)}
.note-canvas-size.act{background:var(--accentSoft);color:var(--accent);border-color:var(--accent)}
.note-canvas-size .dot{display:block;background:currentColor;border-radius:50%}
.note-canvas-size.s1 .dot{width:3px;height:3px}
.note-canvas-size.s2 .dot{width:5px;height:5px}
.note-canvas-size.s3 .dot{width:8px;height:8px}
.note-canvas-size.s4 .dot{width:11px;height:11px}
.note-canvas-wrap{position:relative;width:100%;background:#FFFFFF;overflow:hidden}
.note-canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none;background:#FFFFFF}
.note-canvas.tool-eraser{cursor:cell}
.note-canvas-handle{display:flex;justify-content:center;align-items:center;padding:8px 0;background:var(--rail2);border-top:.5px solid var(--rule2);cursor:ns-resize;touch-action:none;user-select:none;transition:background .12s}
.note-canvas-handle:hover{background:var(--accentSoft)}
.note-canvas-handle:active{background:var(--accent)}
.note-canvas-handle-bar{width:48px;height:4px;background:var(--ink3);border-radius:99px;transition:all .12s;pointer-events:none}
.note-canvas-handle:hover .note-canvas-handle-bar{background:var(--accent);width:60px;height:5px}
.note-canvas-handle:active .note-canvas-handle-bar{background:#fff}
.note-canvas-handle-label{font-size:10px;color:var(--ink3);margin-right:8px;pointer-events:none;letter-spacing:.04em}
.note-canvas-handle:hover .note-canvas-handle-label{color:var(--accent)}
.note-canvas-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:30px 20px;color:var(--ink3);text-align:center}
.note-canvas-empty .btn-primary{margin-top:6px}

/* ===== AI VIEW ===== */
.ai-msgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:75%;padding:10px 14px;font-size:13px;line-height:1.55;border-radius:8px;white-space:pre-wrap}
.ai-msg.user{background:var(--ink);color:var(--bg);align-self:flex-start;border-radius:8px 8px 8px 2px}
.ai-msg.ai{background:var(--rail2);color:var(--ink);align-self:flex-end;border:.5px solid var(--rule);border-radius:8px 8px 2px 8px}
.ai-msg.loading{opacity:.6;font-style:italic}
.ai-foot{padding:12px 16px;border-top:.5px solid var(--rule);display:flex;gap:8px}
.ai-text{flex:1;font-size:13px;padding:8px 12px;border:.5px solid var(--rule2);border-radius:4px;background:var(--panel);color:var(--ink);direction:rtl;resize:none;height:38px;font-family:inherit}
.ai-text:focus{border-color:var(--ink2)}
.ai-no-key{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:2rem;text-align:center}
.ai-no-key p{font-size:13px;color:var(--ink2);line-height:1.7;max-width:400px}
.ai-welcome{text-align:center;color:var(--ink3);font-size:12px;padding:1.5rem 1rem;line-height:1.8}

/* ===== MODAL ===== */
#mr{position:fixed;inset:0;z-index:100;pointer-events:none}
#mr.on{pointer-events:all}
.mbg{width:100%;height:100%;background:rgba(20,24,28,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mc{background:var(--panel);border-radius:8px;border:.5px solid var(--rule2);padding:18px 20px;width:100%;max-width:440px;max-height:96%;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.mc h2{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--ink)}
.mf{margin-bottom:11px}
.mf label{display:block;font-size:10.5px;color:var(--ink3);margin-bottom:5px;letter-spacing:.06em;font-weight:600;text-transform:uppercase}
.mf input,.mf select{width:100%;font-size:13px;padding:6px 10px;border-radius:4px;border:.5px solid var(--rule2);background:var(--panel);color:var(--ink);direction:rtl}
.mf input:focus,.mf select:focus{border-color:var(--ink2)}
.mc-actions{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.mc-actions .btn-primary{padding:7px 18px}
.mc-actions .btn-ghost{padding:7px 16px}

/* Color picker */
.color-pick{display:flex;gap:7px;flex-wrap:wrap}
.color-sw{width:30px;height:30px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .12s;padding:0}
.color-sw:hover{transform:scale(1.1)}
.color-sw.act{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}

/* ===== MOVE POPUP ===== */
.move-pop{position:fixed;background:var(--panel);border:.5px solid var(--rule2);border-radius:5px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:200;min-width:160px;max-width:240px}
.move-pop-h{font-size:10px;color:var(--ink3);padding:5px 8px 4px;border-bottom:.5px solid var(--rule);margin-bottom:3px;letter-spacing:.1em;font-weight:600}
.move-pop-i{display:block;width:100%;text-align:right;padding:7px 10px;font-size:12px;color:var(--ink);border-radius:3px;direction:rtl}
.move-pop-i:hover{background:var(--rail2)}

.btn-clear-done{color:var(--red)!important;border-color:var(--rule2)}
.btn-clear-done:hover{background:var(--redSoft)!important;border-color:var(--red)!important}
.sec-head .done-pill,.area-item .done-pill{font-size:9.5px;background:var(--greenSoft);color:var(--green);padding:1px 5px;border-radius:3px;margin-right:4px;font-weight:600}
.tr[draggable="true"]{cursor:grab}
.tr[draggable="true"]:active{cursor:grabbing}
.tr.dragging{opacity:.45}
.sec-head.drop-target,.area-item.drop-target,.chip-filter.drop-target{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accentSoft)!important;color:var(--accent)!important}

/* ===== CALENDAR ===== */
.cal-wrap{flex:1;overflow:auto;padding:14px 22px;display:flex;flex-direction:column}
.cal-grid{display:flex;flex-direction:column;flex:1;min-height:520px}
.cal-wd-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--rail);border:.5px solid var(--rule);border-radius:6px 6px 0 0}
.cal-wd{padding:7px 8px;font-size:11px;font-weight:600;color:var(--ink2);text-align:center;letter-spacing:.06em;border-left:.5px solid var(--rule)}
.cal-wd:last-child{border-left:none}
.cal-days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(84px,1fr);border:.5px solid var(--rule);border-top:none;border-radius:0 0 6px 6px;background:var(--panel)}
.cal-day{border-left:.5px solid var(--rule);border-top:.5px solid var(--rule);padding:5px 6px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;min-height:0}
.cal-day:hover{background:var(--rail2)}
.cal-day.other{background:var(--rail);color:var(--ink3)}
.cal-day.other .cal-d-num{color:var(--ink3)}
.cal-d-num{font-size:11px;color:var(--ink2);font-family:var(--mono);text-align:left;direction:ltr;padding:1px 3px;align-self:flex-start}
.cal-day.today .cal-d-num{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;padding:0}
.cal-ev{font-size:10.5px;padding:2px 5px;background:var(--accentSoft);color:var(--accent);border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:.5px solid transparent;line-height:1.35}
.cal-ev:hover{border-color:var(--accent)}
.cal-ev.allday{background:var(--accent);color:#fff}
.cal-more{font-size:10px;color:var(--ink3);padding:1px 5px;cursor:pointer}
.cal-more:hover{color:var(--ink)}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-nav .btn-ghost{padding:6px 9px;font-size:13px;line-height:1}
.cal-msg{font-size:11px;padding:1px 6px;border-radius:3px}
.cal-msg.err{background:var(--redSoft);color:var(--red)}
.cal-help{font-size:11px;color:var(--ink3);max-width:520px;line-height:1.7;text-align:right;direction:rtl;background:var(--rail2);border:.5px solid var(--rule);border-radius:5px;padding:10px 14px;margin-top:6px}
.cal-help code{font-family:var(--mono);font-size:10.5px;background:var(--panel);padding:1px 5px;border-radius:3px;color:var(--ink)}

/* Mobile burger */
.mb-burger{display:none;position:fixed;top:14px;right:14px;z-index:50;width:36px;height:36px;border-radius:5px;background:var(--panel);border:.5px solid var(--rule2);align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.mb-burger svg{width:18px;height:18px;color:var(--ink)}

@media(max-width:900px){
  #sb{position:fixed;top:0;right:0;height:100vh;z-index:40;transform:translateX(110%);transition:transform .25s ease;border-left:.5px solid var(--rule2);box-shadow:-2px 0 10px rgba(0,0,0,.05)}
  #sb.open{transform:translateX(0)}
  .mb-burger{display:flex}
  #dp{position:fixed;top:0;left:0;height:100vh;z-index:30;width:min(360px,100%);box-shadow:2px 0 10px rgba(0,0,0,.05)}
  .mn-h{padding:14px 16px 0}
  .kpis{padding:14px 16px 0}
  .tlb{padding:14px 16px 10px}
  .tl-wrap{padding:0 16px 22px}
  .ai-msgs{padding:16px}
  .cal-wrap{padding:8px}
  .cal-days{grid-auto-rows:minmax(56px,1fr)}
  .cal-day{padding:3px 4px}
  .cal-ev{font-size:9.5px;padding:1px 4px}
  .notes-add{padding:14px 16px 8px}
  .notes-list{padding:4px 16px 22px}
  .kpi{min-width:0}
  .tl-head{display:none}
  .tr{grid-template-columns:22px 1fr auto;gap:8px;padding:9px 12px}
  .tr-status-cell,.tr-priority-cell,.tr-due-cell,.tr-more{display:none}
  .tr-mobi-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:4px}
}
@media(min-width:901px){.tr-mobi-meta{display:none}}

function findTask(id){for(const p of S.projects)for(const a of p.areas){const t=a.tasks.find(t=>t.id===id);if(t)return{task:t,proj:p,area:a};}return null;}
function isOverdue(due){if(!due)return false;return due<TODAY;}
function fmtDate(d){if(!d)return null;const[y,m,day]=d.split('-');const months=['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];return parseInt(day)+' '+months[parseInt(m)-1];}
function fmtCreated(iso){if(!iso)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(iso))return fmtDate(iso);try{const d=new Date(iso);if(isNaN(d))return '';return fmtDate(d.toISOString().split('T')[0]);}catch(e){return '';}}
function stripHtml(s){if(!s)return '';const d=document.createElement('div');d.innerHTML=s;return (d.textContent||'').trim();}
function gcalUrl(t){const ti=encodeURIComponent(t.title);const de=encodeURIComponent(stripHtml(t.content||'')||t.notes||'');let dt='';if(t.dueDate){const d=t.dueDate.replace(/-/g,'');const e=new Date(t.dueDate+'T12:00:00');e.setDate(e.getDate()+1);const es=e.toISOString().split('T')[0].replace(/-/g,'');dt='&dates='+d+'/'+es;}return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+ti+dt+'&details='+de;}

// All tasks flat
function getAllTasks(){
  const out=[];
  S.projects.forEach(p=>p.areas.forEach(a=>a.tasks.forEach(t=>out.push({task:t,proj:p,area:a}))));
  return out;
}
function sortTasks(arr){
  return arr.sort((a,b)=>{
    if(a.task.status==='הושלם'&&b.task.status!=='הושלם')return 1;
    if(b.task.status==='הושלם'&&a.task.status!=='הושלם')return -1;
    const oa=isOverdue(a.task.dueDate)&&a.task.status!=='הושלם';
    const ob=isOverdue(b.task.dueDate)&&b.task.status!=='הושלם';
    if(oa&&!ob)return -1;if(ob&&!oa)return 1;
    const ua=a.task.priority==='דחוף',ub=b.task.priority==='דחוף';
    if(ua&&!ub)return -1;if(ub&&!ua)return 1;
    if(a.task.dueDate&&b.task.dueDate)return a.task.dueDate.localeCompare(b.task.dueDate);
    if(a.task.dueDate)return -1;if(b.task.dueDate)return 1;
    return 0;
  });
}

  if(S.view==='today'){title='היום';subtitle='משימות שתאריך היעד שלהן הוא היום ('+TODAY+')';tasks=open.filter(x=>x.task.dueDate===TODAY);}
  else if(S.view==='week'){title='השבוע';subtitle='משימות שתאריך היעד שלהן ב-7 הימים הקרובים';tasks=open.filter(x=>x.task.dueDate&&x.task.dueDate>=TODAY&&x.task.dueDate<=wkEnd);}
  else if(S.view==='overdue'){title='באיחור';subtitle='משימות שעבר תאריך היעד שלהן ולא הושלמו';tasks=open.filter(x=>isOverdue(x.task.dueDate));}
  else if(S.view==='urgent'){title='דחוף';subtitle='משימות בעדיפות דחוף שטרם הושלמו';tasks=open.filter(x=>x.task.priority==='דחוף');}
  rFilterView(mn,title,subtitle,sortTasks(tasks));
}

function rFilterView(mn,title,subtitle,tasks){
  const tasksHtml=tasks.length?tasks.map(x=>renderTaskRow(x.task,x.area.name,x.proj,true)).join(''):'<div class="empty-st">אין משימות להצגה</div>';
  mn.innerHTML=`
    <header class="mn-h">
      <div class="mn-h-row">
        <div class="mn-h-l">
          <h1>${esc(title)}</h1>
          <div class="mn-h-meta"><span>${esc(subtitle)}</span><span style="color:var(--ink3)">·</span><span>${tasks.length} משימות</span></div>
        </div>
      </div>
    </header>
    <div class="tl-wrap">
      <div class="tl">
        <div class="tl-head"><div></div><div>משימה</div><div>עדיפות</div><div>סטטוס</div><div>יעד</div><div></div></div>
        ${tasksHtml}
      </div>
    </div>
  `;
}

// ----- Dashboard (summary of all projects + immediate priorities) -----
function rDashboard(mn){
  const all=getAllTasks();
  const open=all.filter(x=>x.task.status!=='הושלם');
  const overdue=open.filter(x=>isOverdue(x.task.dueDate));
  const urgent=open.filter(x=>x.task.priority==='דחוף');
  const today=open.filter(x=>x.task.dueDate===TODAY);
  const today7=new Date();today7.setDate(today7.getDate()+7);
  const wkEnd=today7.toISOString().split('T')[0];
  const week=open.filter(x=>x.task.dueDate&&x.task.dueDate>=TODAY&&x.task.dueDate<=wkEnd);
  const done=all.filter(x=>x.task.status==='הושלם');

  // Project summary cards
  const projCards=S.projects.map(p=>{
    const pTasks=p.areas.flatMap(a=>a.tasks);
    const pOpen=pTasks.filter(t=>t.status!=='הושלם').length;
    const pTotal=pTasks.length;
    const pOverdue=pTasks.filter(t=>isOverdue(t.dueDate)&&t.status!=='הושלם').length;
    const pUrgent=pTasks.filter(t=>t.priority==='דחוף'&&t.status!=='הושלם').length;
    const pToday=pTasks.filter(t=>t.dueDate===TODAY&&t.status!=='הושלם').length;
    const pProgress=pTotal>0?Math.round(((pTotal-pOpen)/pTotal)*100):0;
    const col=projColor(p);
    const status=pUrgent>0?'urgent':(pOverdue>0?'overdue':(pOpen===0&&pTotal>0?'done':'active'));
    return `<div class="dash-card" onclick="selP('${p.id}')">
      <div class="dash-card-head">
        <span class="dash-card-dot" style="background:${col.hex}"></span>
        <span class="dash-card-name">${esc(p.name)}</span>
        ${pUrgent?'<span class="dash-card-badge urgent" title="דחופות">★ '+pUrgent+'</span>':''}
        ${pOverdue?'<span class="dash-card-badge overdue" title="באיחור">⚠ '+pOverdue+'</span>':''}
      </div>
      <div class="dash-card-stats">
        <div class="dash-stat"><div class="dash-stat-v">${pOpen}</div><div class="dash-stat-l">פעילות</div></div>
        <div class="dash-stat"><div class="dash-stat-v">${pTotal}</div><div class="dash-stat-l">סה"כ</div></div>
        <div class="dash-stat"><div class="dash-stat-v">${pToday}</div><div class="dash-stat-l">היום</div></div>
        <div class="dash-stat"><div class="dash-stat-v">${p.areas.length}</div><div class="dash-stat-l">תחומים</div></div>
      </div>
      <div class="dash-card-bar"><div class="dash-card-bar-fill" style="width:${pProgress}%;background:${col.hex}"></div></div>
      <div class="dash-card-foot">
        <span style="font-size:10.5px;color:var(--ink3)">${pProgress}% הושלם</span>
        <span style="font-size:10.5px;color:var(--ink3)">${status==='done'?'✓ סיום':status==='urgent'?'דחוף':status==='overdue'?'באיחור':'פעיל'}</span>
      </div>
    </div>`;
  }).join('');

  // Priority list: combine overdue + urgent + today, dedupe, top 8
  const seen=new Set();
  const priorityList=[];
  [...overdue,...urgent,...today].forEach(x=>{
    if(seen.has(x.task.id))return;
    seen.add(x.task.id);priorityList.push(x);
  });
  const priorityTop=sortTasks(priorityList).slice(0,8);
  const priorityHtml=priorityTop.length?priorityTop.map(x=>renderTaskRow(x.task,x.area.name,x.proj,true)).join(''):'<div style="padding:30px 0;text-align:center;color:var(--ink3);font-size:13px">אין משימות שדורשות תשומת לב מיידית ✓</div>';

  mn.innerHTML=`
    <header class="mn-h">
      <div class="mn-h-row">
        <div class="mn-h-l">
          <h1>מבט-על</h1>
          <div class="mn-h-meta"><span>סיכום כל הפרויקטים והמשימות</span><span style="color:var(--ink3)">·</span><span>${TODAY}</span></div>
        </div>
        <div class="mn-h-actions">
          <button class="btn-ghost" onclick="selView('ai')">${IC.ai} AI</button>
          <button class="btn-primary" onclick="mNewP()">${IC.plus} פרויקט</button>
        </div>
      </div>
    </header>

    <div class="kpis">
      <button class="kpi kpi-btn" onclick="selView('today')"><div class="kpi-l">היום</div><div class="kpi-row"><div class="kpi-v">${today.length}</div></div></button>
      <button class="kpi kpi-btn ${urgent.length?'acc-r':''}" onclick="selView('urgent')"><div class="kpi-l">דחופות</div><div class="kpi-row"><div class="kpi-v">${urgent.length}</div></div></button>
      <button class="kpi kpi-btn ${overdue.length?'acc-a':''}" onclick="selView('overdue')"><div class="kpi-l">באיחור</div><div class="kpi-row"><div class="kpi-v">${overdue.length}</div></div></button>
      <button class="kpi kpi-btn" onclick="selView('week')"><div class="kpi-l">השבוע</div><div class="kpi-row"><div class="kpi-v">${week.length}</div></div></button>
      <div class="kpi"><div class="kpi-l">פעילות</div><div class="kpi-row"><div class="kpi-v">${open.length}</div><div class="kpi-s">מתוך ${all.length}</div></div></div>
      <div class="kpi acc-g"><div class="kpi-l">הושלמו</div><div class="kpi-row"><div class="kpi-v">${done.length}</div></div></div>
    </div>

    <div class="dash-body">
      <div class="dash-section-title">
        <span>פרויקטים</span>
        <span class="dash-section-cnt">${S.projects.length}</span>
      </div>
      <div class="dash-grid">${projCards||'<div class="empty-st">אין פרויקטים<br><button class="btn-primary" style="margin-top:10px" onclick="mNewP()">+ פרויקט חדש</button></div>'}</div>

      ${urgent.length?`
      <div class="dash-section-title" style="margin-top:22px">
        <span style="color:var(--red)">🔥 דחופות</span>
        <span class="dash-section-cnt">${urgent.length}</span>
        ${urgent.length>5?'<button class="btn-ghost" style="margin-right:auto;font-size:11px" onclick="selView(\'urgent\')">הצג הכל →</button>':''}
      </div>
      <div class="tl">
        <div class="tl-head"><div></div><div>משימה</div><div>עדיפות</div><div>סטטוס</div><div>יעד</div><div></div></div>
        ${sortTasks(urgent.slice()).slice(0,5).map(x=>renderTaskRow(x.task,x.area.name,x.proj,true)).join('')}
      </div>`:''}

      <div class="dash-section-title" style="margin-top:22px">
        <span>דורש תשומת לב מיידית</span>
        <span class="dash-section-cnt">${priorityTop.length}</span>
        ${priorityList.length>8?'<button class="btn-ghost" style="margin-right:auto;font-size:11px" onclick="selView(\'overdue\')">הצג הכל →</button>':''}
      </div>
      <div class="tl">
        <div class="tl-head"><div></div><div>משימה</div><div>עדיפות</div><div>סטטוס</div><div>יעד</div><div></div></div>
        ${priorityHtml}
      </div>
    </div>
  `;
}

function rProject(mn){
  const p=ap();
  if(!p){mn.innerHTML='<div class="empty-st">בחר פרויקט מהרשימה<br><br><button class="btn-primary" onclick="mNewP()">+ פרויקט חדש</button></div>';return;}
  const all=p.areas.flatMap(a=>a.tasks.map(t=>({task:t,area:a,proj:p})));
  const total=all.length;
  const open=all.filter(x=>x.task.status!=='הושלם').length;
  const overdue=all.filter(x=>isOverdue(x.task.dueDate)&&x.task.status!=='הושלם').length;
  const done=total-open;
  const today7=new Date();today7.setDate(today7.getDate()+7);
  const wkEnd=today7.toISOString().split('T')[0];
  const week=all.filter(x=>x.task.dueDate&&x.task.dueDate>=TODAY&&x.task.dueDate<=wkEnd&&x.task.status!=='הושלם').length;

  // Filter & group
  let filtered=S.aaid&&S.aaid!=='__all__'?all.filter(x=>x.area.id===S.aaid):all;
  if(S.filterStatus)filtered=filtered.filter(x=>x.task.status===S.filterStatus);
  filtered=sortTasks(filtered.slice());

  let groupsHtml='';
  const isSingleArea=S.aaid&&S.aaid!=='__all__';
  if(isSingleArea&&S.grouping!=='priority'&&S.grouping!=='status'){
    // Single area view - flat list
    const a=p.areas.find(a=>a.id===S.aaid);
    if(a&&filtered.length){
      groupsHtml=filtered.map(x=>renderTaskRow(x.task,null,null,false)).join('');
    } else {
      groupsHtml='<div class="empty-st">אין משימות בתחום זה</div>';
    }
  } else if(!isSingleArea&&S.grouping==='area'){
    p.areas.forEach(a=>{
      const items=filtered.filter(x=>x.area.id===a.id);
      if(items.length||!S.filterStatus){
        const col=S.collapsed[a.id]?'col':'';
        groupsHtml+='<button class="sec-head '+col+'" onclick="toggleCollapse(\''+a.id+'\')" ondragover="areaDragOver(event)" ondragleave="areaDragLeave(event)" ondrop="areaDrop(\''+a.id+'\',event)"><span class="chev">'+IC.arrow+'</span><span>'+esc(a.name)+'</span><span class="cnt">· '+items.length+'</span><span class="ic-add" onclick="event.stopPropagation();mNewT(\''+a.id+'\')" title="הוסף משימה">+</span></button>';
        if(!S.collapsed[a.id]){
          if(items.length)groupsHtml+=items.map(x=>renderTaskRow(x.task,null,null,false)).join('');
          else groupsHtml+='<div style="padding:14px 16px;font-size:12px;color:var(--ink3);text-align:center;border-bottom:.5px solid var(--rule)">אין משימות</div>';
        }
      }
    });
  } else if(S.grouping==='status'){
    STATUSES.forEach(s=>{
      const items=filtered.filter(x=>x.task.status===s);
      if(!items.length)return;
      const col=S.collapsed['s_'+s]?'col':'';
      groupsHtml+='<button class="sec-head '+col+'" onclick="toggleCollapse(\'s_'+s+'\')"><span class="chev">'+IC.arrow+'</span><span>'+esc(s)+'</span><span class="cnt">· '+items.length+'</span></button>';
      if(!S.collapsed['s_'+s])groupsHtml+=items.map(x=>renderTaskRow(x.task,x.area.name,null,false)).join('');
    });
  } else if(S.grouping==='priority'){
    const buckets=[
      {key:'דחוף',label:'דחוף',icon:'🔥'},
      {key:'בינוני',label:'בינוני',icon:'•'},
      {key:'נמוך',label:'נמוך',icon:'·'},
      {key:'',label:'ללא עדיפות',icon:'—'}
    ];
    buckets.forEach(b=>{
      const items=filtered.filter(x=>(x.task.priority||'')===b.key);
      if(!items.length)return;
      const col=S.collapsed['p_'+b.key]?'col':'';
      const cls=b.key==='דחוף'?'pri-urgent':(b.key==='בינוני'?'pri-med':'');
      groupsHtml+='<button class="sec-head '+col+' '+cls+'" onclick="toggleCollapse(\'p_'+b.key+'\')"><span class="chev">'+IC.arrow+'</span><span>'+b.icon+' '+esc(b.label)+'</span><span class="cnt">· '+items.length+'</span></button>';
      if(!S.collapsed['p_'+b.key])groupsHtml+=items.map(x=>renderTaskRow(x.task,x.area.name,null,false)).join('');
    });
  } else {
    if(filtered.length)groupsHtml=filtered.map(x=>renderTaskRow(x.task,x.area.name,null,false)).join('');
    else groupsHtml='<div class="empty-st">אין משימות</div>';
  }

  const isAllArea=!S.aaid||S.aaid==='__all__';
  const curAreaName=isAllArea?'הכל':(p.areas.find(a=>a.id===S.aaid)?.name||'הכל');

  // Status filter chips
  const statusChips=STATUSES.filter(s=>s!=='הושלם').map(s=>'<button class="chip-filter '+(S.filterStatus===s?'on':'')+'" onclick="setFilterStatus(\''+s+'\')">'+esc(s)+(S.filterStatus===s?' '+IC.x:'')+'</button>').join('');

  // Area chips inside toolbar (with edit pencil for active area)
  const areaChips='<button class="chip-filter '+(isAllArea?'on':'')+'" onclick="selA(\'__all__\')">הכל · '+total+'</button>'+
    p.areas.map(a=>{
      const act=S.aaid===a.id;
      const editBtn=act?'<button class="chip-edit-btn" onclick="event.stopPropagation();mEditA(\''+a.id+'\')" title="עריכת תחום">✎</button>':'';
      return '<span class="chip-wrap"><button class="chip-filter '+(act?'on':'')+'" onclick="selA(\''+a.id+'\')">'+esc(a.name)+' · '+a.tasks.length+'</button>'+editBtn+'</span>';
    }).join('')+
    '<button class="chip-filter" onclick="mNewA()" title="תחום חדש" style="border-style:dashed">+</button>';

  mn.innerHTML=`
    <header class="mn-h">
      <div class="mn-crumb"><span>פרויקטים</span><span class="sep">/</span><span class="cur">${esc(p.name)}</span></div>
      <div class="mn-h-row">
        <div class="mn-h-l">
          <h1>${esc(p.name)}</h1>
          <div class="mn-h-meta">
            <span class="mn-h-code">#${esc(p.name)}</span>
            <span style="color:var(--ink3)">·</span><span>${total} משימות · ${p.areas.length} תחומים</span>
            <span style="color:var(--ink3)">·</span><span>${open} פעילות</span>
          </div>
        </div>
        <div class="mn-h-actions">
          ${(p.areas.find(a=>a.name===DONE_AREA_NAME)?.tasks.length||0)>0?'<button class="btn-ghost btn-clear-done" onclick="clearDoneInProject(\''+p.id+'\')" title="מחק את כל המשימות שהושלמו בפרויקט">'+IC.trash+' נקה הושלמו ('+p.areas.find(a=>a.name===DONE_AREA_NAME).tasks.length+')</button>':''}
          <button class="btn-ghost" onclick="mEditP()">${IC.edit} עריכה</button>
          <button class="btn-ghost" onclick="selView('ai',\'${p.id}\')">${IC.ai} AI</button>
          <button class="btn-primary" onclick="mNewT()">${IC.plus} משימה</button>
        </div>
      </div>
    </header>
    <div class="kpis">
      <div class="kpi"><div class="kpi-l">פתוחות</div><div class="kpi-row"><div class="kpi-v">${open}</div><div class="kpi-s">מתוך ${total}</div></div></div>
      <div class="kpi ${overdue?'acc-r':''}"><div class="kpi-l">באיחור</div><div class="kpi-row"><div class="kpi-v">${overdue}</div></div></div>
      <div class="kpi"><div class="kpi-l">השבוע</div><div class="kpi-row"><div class="kpi-v">${week}</div></div></div>
      <div class="kpi acc-g"><div class="kpi-l">הושלמו</div><div class="kpi-row"><div class="kpi-v">${done}</div></div></div>
    </div>
    <div class="tlb">
      ${areaChips}
      <span class="tlb-divider"></span>
      ${statusChips}
      <span class="tlb-grow"></span>
      <span class="tlb-lbl">קבץ לפי</span>
      <select class="tlb-sel" onchange="setGrouping(this.value)">
        <option value="area" ${S.grouping==='area'?'selected':''} ${isAllArea?'':'disabled'}>תחום</option>
        <option value="status" ${S.grouping==='status'?'selected':''}>סטטוס</option>
        <option value="priority" ${S.grouping==='priority'?'selected':''}>עדיפות</option>
        <option value="none" ${S.grouping==='none'?'selected':''}>ללא</option>
      </select>
    </div>
    <div class="tl-wrap">
      <div class="tl">
        <div class="tl-head"><div></div><div>משימה · ${esc(curAreaName)}</div><div>עדיפות</div><div>סטטוס</div><div>יעד</div><div></div></div>
        ${groupsHtml}
        <div class="tl-add" onclick="mNewT()">+ הוסף משימה</div>
      </div>
    </div>
  `;
}

function renderTaskRow(t,areaName,proj,showProj){
  const isDone=t.status==='הושלם';
  const od=isOverdue(t.dueDate)&&!isDone;
  const sel=t.id===S.selTaskId?'sel':'';
  const due=t.dueDate?fmtDate(t.dueDate):'—';
  // Status chip
  let statusCls='s-open',statusLbl=t.status||'פתוח';
  if(t.status==='בביצוע')statusCls='s-prog';
  else if(t.status==='תלוי')statusCls='s-wait';
  else if(t.status==='הושלם')statusCls='s-done';
  // Priority chip
  let priorityHtml='<span class="chip-em">—</span>';
  if(t.priority==='דחוף')priorityHtml='<span class="chip-pr p-r"><span class="chip-pr-dot"></span>דחוף</span>';
  else if(t.priority==='בינוני')priorityHtml='<span class="chip-pr p-a"><span class="chip-pr-dot"></span>בינוני</span>';
  else if(t.priority==='נמוך')priorityHtml='<span class="chip-pr p-l"><span class="chip-pr-dot"></span>נמוך</span>';
  // Mobile meta
  const mobiMeta='<div class="tr-mobi-meta">'+
    (t.priority?priorityHtml:'')+
    '<span class="chip-st '+statusCls+'">'+esc(statusLbl)+'</span>'+
    (t.dueDate?'<span class="tr-due '+(od?'od':'')+'">'+esc(due)+(od?' !':'')+'</span>':'')+
    (areaName?'<span class="tr-area">· '+esc(areaName)+'</span>':'')+
    '</div>';
  return `<div class="tr ${isDone?'done':''} ${sel}" data-task-id="${t.id}" draggable="true" ondragstart="dragStart('${t.id}',event)" ondragend="dragEnd(event)" onclick="selectTask('${t.id}')">
    <button class="cb ${isDone?'done':''}" onclick="event.stopPropagation();toggleDone('${t.id}')" title="${isDone?'בטל סימון':'סמן כהושלם'}"></button>
    <div class="tr-title-wrap">
      <span class="tr-title">${esc(t.title)}</span>
      ${t.importance==='גבוהה'?'<span class="imp-tag">חשוב</span>':''}
      ${t.assigned?'<span class="chip-as">'+esc(t.assigned)+'</span>':''}
      ${areaName?'<span class="tr-area">· '+esc(areaName)+'</span>':''}
      ${showProj&&proj?'<span class="tr-proj">· '+esc(proj.name)+'</span>':''}
      ${mobiMeta}
    </div>
    <div class="tr-priority-cell">${priorityHtml}</div>
    <div class="tr-status-cell"><span class="chip-st ${statusCls}">${esc(statusLbl)}</span></div>
    <div class="tr-due-cell tr-due ${od?'od':''}">${t.dueDate?esc(due)+(od?' <span style="font-size:10px">!</span>':''):'<span style="color:var(--ink3)">—</span>'}</div>
    <button class="tr-more" onclick="event.stopPropagation();showMovePop('${t.id}',this,event)" title="העבר תחום">${IC.more}</button>
  </div>`;
}

// ----- Detail Panel -----
function rDetail(){
  // Detail panel is a sibling of #mn, render inline
  const old=document.getElementById('dp');if(old)old.remove();
  if(!S.selTaskId)return;
  const r=findTask(S.selTaskId);
  if(!r){S.selTaskId=null;return;}
  const t=r.task;
  const dp=document.createElement('aside');
  dp.id='dp';
  // Status options
  const statusOpts=STATUSES.map(s=>{
    let cls='';
    if(t.status===s){
      if(s==='בביצוע')cls='act-acc';
      else if(s==='תלוי')cls='act-a';
      else if(s==='הושלם')cls='act-g';
      else cls='act-ink';
      cls='act '+cls;
    }
    return '<button class="opt '+cls+'" onclick="updTask(\''+t.id+'\',{status:\''+s+'\'})">'+esc(s)+'</button>';
  }).join('');
  // Priority options
  const prioOpts=[['','—',''],['דחוף','דחוף','act-r'],['בינוני','בינוני','act-a'],['נמוך','נמוך','act-l']].map(([v,lbl,cls])=>{
    const isAct=(t.priority||'')===v;
    return '<button class="opt '+(isAct?'act '+cls:'')+'" onclick="updTask(\''+t.id+'\',{priority:\''+v+'\'})">'+esc(lbl)+'</button>';
  }).join('');
  // Importance options
  const impOpts=[['','—',''],['גבוהה','גבוהה','act-a'],['בינונית','בינונית','act-acc'],['נמוכה','נמוכה','act-l']].map(([v,lbl,cls])=>{
    const isAct=(t.importance||'')===v;
    return '<button class="opt '+(isAct?'act '+cls:'')+'" onclick="updTask(\''+t.id+'\',{importance:\''+v+'\'})">'+esc(lbl)+'</button>';

  // Assignee options

function fmtNoteCmd(noteId,cmd,arg){
  const el=document.getElementById('note-content-'+noteId);
  if(el)el.focus();
  document.execCommand(cmd,false,arg||null);
}

// ===== CANVAS (handwriting) =====
function mountAllCanvases(){
  S.notes.forEach(n=>{
    if(!expandedNotes.has(n.id))return;
    const cv=document.getElementById('note-canvas-'+n.id);
    if(cv&&!cv.dataset.mounted){mountNoteCanvas(cv,n);cv.dataset.mounted='1';}
    // Update active states for tool/color/size
    refreshCanvasUI(n.id);
  });
}

function refreshCanvasUI(noteId){
  const sec=document.getElementById('note-canvas-section-'+noteId);
  if(!sec)return;
  const st=getCanvasState(noteId);
  sec.querySelectorAll('.note-canvas-tool[data-tool]').forEach(b=>b.classList.toggle('act',b.dataset.tool===st.tool));
  sec.querySelectorAll('.note-canvas-color[data-color]').forEach(b=>b.classList.toggle('act',b.dataset.color===st.color));
  sec.querySelectorAll('.note-canvas-size[data-size]').forEach(b=>b.classList.toggle('act',parseFloat(b.dataset.size)===st.size));
  const tb=sec.querySelector('[data-touch]');
  if(tb){tb.classList.toggle('act',st.acceptTouch);tb.style.color=st.acceptTouch?'var(--accent)':'var(--ink2)';}
  const cv=sec.querySelector('.note-canvas');
  if(cv)cv.classList.toggle('tool-eraser',st.tool==='eraser');
}

function mountNoteCanvas(canvas,note){
  const wrap=canvas.parentElement;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  let cssW=0,cssH=0;
  let drawing=false,lastX=0,lastY=0,lastP=0.5;

  function setupSize(preserve){
    const oldData=preserve?canvas.toDataURL('image/png'):null;
    cssW=Math.max(1,wrap.clientWidth);
    cssH=Math.max(1,wrap.clientHeight);
    canvas.style.width=cssW+'px';
    canvas.style.height=cssH+'px';
    canvas.width=Math.floor(cssW*dpr);
    canvas.height=Math.floor(cssH*dpr);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr,dpr);
    ctx.lineCap='round';
    ctx.lineJoin='round';
    if(oldData){
      const img=new Image();
      img.onload=()=>{ctx.drawImage(img,0,0,cssW,cssH);};
      img.src=oldData;
    } else if(note.canvasData){
      const img=new Image();
      img.onload=()=>{ctx.drawImage(img,0,0,cssW,cssH);};
      img.src=note.canvasData;
    }
  }
  setupSize(false);

  // Watch for container resize (handle drag)
  const ro=new ResizeObserver(()=>setupSize(true));
  ro.observe(wrap);

  function snapshot(){
    const st=getCanvasState(note.id);
    st.undoStack.push(canvas.toDataURL('image/png'));
    if(st.undoStack.length>15)st.undoStack.shift();
  }

  function shouldAccept(e){
    const st=getCanvasState(note.id);
    if(e.pointerType==='touch'&&!st.acceptTouch)return false;
    return true;
  }

  canvas.addEventListener('pointerdown',(e)=>{
    if(!shouldAccept(e))return;
    e.preventDefault();
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    drawing=true;
    snapshot();
    const r=canvas.getBoundingClientRect();
    lastX=e.clientX-r.left;
    lastY=e.clientY-r.top;
    lastP=e.pressure>0?e.pressure:0.5;
    // Single tap dot
    const st=getCanvasState(note.id);
    ctx.save();
    if(st.tool==='eraser'){
      ctx.globalCompositeOperation='destination-out';
      ctx.fillStyle='rgba(0,0,0,1)';
      ctx.beginPath();ctx.arc(lastX,lastY,st.size*2,0,Math.PI*2);ctx.fill();
    } else {
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle=st.tool==='highlight'?st.color+'66':st.color;
      const r2=st.tool==='highlight'?st.size*2:st.size*(0.5+lastP)*0.6;
      ctx.beginPath();ctx.arc(lastX,lastY,Math.max(0.6,r2),0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });

  canvas.addEventListener('pointermove',(e)=>{
    if(!drawing||!shouldAccept(e))return;
    e.preventDefault();
    const r=canvas.getBoundingClientRect();
    const x=e.clientX-r.left;
    const y=e.clientY-r.top;
    const p=e.pressure>0?e.pressure:0.5;
    const st=getCanvasState(note.id);
    ctx.save();
    if(st.tool==='eraser'){
      ctx.globalCompositeOperation='destination-out';
      ctx.lineWidth=st.size*4;
      ctx.strokeStyle='rgba(0,0,0,1)';
    } else if(st.tool==='highlight'){
      ctx.globalCompositeOperation='source-over';
      ctx.strokeStyle=st.color+'55';
      ctx.lineWidth=st.size*4;
      ctx.lineCap='butt';
    } else {
      ctx.globalCompositeOperation='source-over';
      ctx.strokeStyle=st.color;
      const avgP=(p+lastP)/2;
      const w=e.pointerType==='pen'?st.size*(0.4+avgP*1.4):st.size;
      ctx.lineWidth=Math.max(0.5,w);
    }
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();
    ctx.restore();
    lastX=x;lastY=y;lastP=p;
  });

  function endStroke(e){
    if(!drawing)return;
    drawing=false;
    try{if(e&&e.pointerId)canvas.releasePointerCapture(e.pointerId);}catch(_){}
    saveCanvasData(note.id);
  }
  canvas.addEventListener('pointerup',endStroke);
  canvas.addEventListener('pointercancel',endStroke);
  canvas.addEventListener('pointerleave',(e)=>{if(drawing)endStroke(e);});
}

function saveCanvasData(noteId){
  const cv=document.getElementById('note-canvas-'+noteId);
  if(!cv)return;
  const n=S.notes.find(x=>x.id===noteId);
  if(!n)return;
  // Check if canvas has any content
  try{
    const data=cv.toDataURL('image/png');
    n.canvasData=data;
    n.canvasOpen=true;
    clearTimeout(window._cvsv);
    window._cvsv=setTimeout(()=>sv(),600);
  }catch(e){console.error('Canvas save err',e);}
}

function setCanvasTool(noteId,tool){
  getCanvasState(noteId).tool=tool;
  refreshCanvasUI(noteId);
}
function setCanvasColor(noteId,color){
  const st=getCanvasState(noteId);
  st.color=color;
  if(st.tool==='eraser')st.tool='pen';
  refreshCanvasUI(noteId);
}
function setCanvasPenSize(noteId,size){
  getCanvasState(noteId).size=parseFloat(size);
  refreshCanvasUI(noteId);
}
function toggleCanvasTouch(noteId){
  const st=getCanvasState(noteId);
  st.acceptTouch=!st.acceptTouch;
  refreshCanvasUI(noteId);
}
function canvasUndo(noteId){
  const st=getCanvasState(noteId);
  if(!st.undoStack.length)return;
  const data=st.undoStack.pop();
  const cv=document.getElementById('note-canvas-'+noteId);
  if(!cv)return;
  const ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.scale(dpr,dpr);
  if(data){
    const img=new Image();
    img.onload=()=>{
      ctx.drawImage(img,0,0,cv.width/dpr,cv.height/dpr);
      saveCanvasData(noteId);
    };
    img.src=data;
  } else {
    const n=S.notes.find(x=>x.id===noteId);
    if(n){n.canvasData='';sv();}
  }
}
function canvasClear(noteId){
  if(!confirm('לנקות את כל לוח הכתיבה?'))return;
  const cv=document.getElementById('note-canvas-'+noteId);
  if(!cv)return;
  const ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  // Save snapshot for undo
  const st=getCanvasState(noteId);
  st.undoStack.push(cv.toDataURL('image/png'));
  if(st.undoStack.length>15)st.undoStack.shift();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.scale(dpr,dpr);
  const n=S.notes.find(x=>x.id===noteId);
  if(n){n.canvasData='';sv();}
}
function toggleNoteCanvas(noteId){
  const n=S.notes.find(x=>x.id===noteId);
  if(!n)return;
  n.canvasOpen=!n.canvasOpen;
  sv();render();
}

// Resize handle
function startCanvasResize(noteId,e){
  e.preventDefault();
  const wrap=document.getElementById('note-canvas-wrap-'+noteId);
  if(!wrap)return;
  canvasResizeState={noteId,startY:e.clientY,startH:wrap.clientHeight,wrap};
  document.body.style.cursor='ns-resize';
  document.body.style.userSelect='none';
  try{e.target.setPointerCapture(e.pointerId);}catch(_){}
}
document.addEventListener('pointermove',(e)=>{
  if(!canvasResizeState)return;
  const dy=e.clientY-canvasResizeState.startY;
  const newH=Math.max(150,Math.min(1200,canvasResizeState.startH+dy));
  canvasResizeState.wrap.style.height=newH+'px';
});
document.addEventListener('pointerup',()=>{
  if(!canvasResizeState)return;
  const finalH=canvasResizeState.wrap.clientHeight;
  const n=S.notes.find(x=>x.id===canvasResizeState.noteId);
  if(n){n.canvasHeight=finalH;sv();}
  canvasResizeState=null;
  document.body.style.cursor='';
  document.body.style.userSelect='';
});

// ===== GOOGLE CALENDAR =====
const GCAL_DISC='https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
const GCAL_SCOPE='https://www.googleapis.com/auth/calendar';
const TASKS_CAL_NAME='משימות (אביחי)';
let gcalCachedCalendarId=null;

function getGcalConfig(){return {clientId:localStorage.getItem('gcal_client_id')||'',apiKey:localStorage.getItem('gcal_api_key')||''};}
function setGcalConfig(clientId,apiKey){localStorage.setItem('gcal_client_id',clientId);localStorage.setItem('gcal_api_key',apiKey);}
function clearGcalConfig(){localStorage.removeItem('gcal_client_id');localStorage.removeItem('gcal_api_key');localStorage.removeItem('gcal_calendar_id');sessionStorage.removeItem('gcal_token');gcalCachedCalendarId=null;}

function loadGScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>rej(new Error('failed to load '+src));document.head.appendChild(s);});}

async function gcalInit(){
  if(gcalLoadPromise)return gcalLoadPromise;
  const cfg=getGcalConfig();
  if(!cfg.clientId||!cfg.apiKey)throw new Error('NO_CONFIG');
  gcalLoadPromise=(async()=>{
    if(!window.gapi)await loadGScript('https://apis.google.com/js/api.js');
    if(!window.google||!window.google.accounts||!window.google.accounts.oauth2)await loadGScript('https://accounts.google.com/gsi/client');
    await new Promise((res,rej)=>gapi.load('client',{callback:res,onerror:rej}));
    await gapi.client.init({apiKey:cfg.apiKey,discoveryDocs:[GCAL_DISC]});
    gcalTokenClient=google.accounts.oauth2.initTokenClient({client_id:cfg.clientId,scope:GCAL_SCOPE,callback:()=>{}});
    const saved=sessionStorage.getItem('gcal_token');
    if(saved){try{const p=JSON.parse(saved);if(p.expires>Date.now()){gcalAccessToken=p.token;gapi.client.setToken({access_token:p.token});}}catch(_){}}
  })();
  return gcalLoadPromise;
}

function gcalSignIn(){
  return new Promise((res,rej)=>{
    if(!gcalTokenClient)return rej(new Error('not initialized'));
    gcalTokenClient.callback=(resp)=>{
      if(resp.error)return rej(new Error(resp.error_description||resp.error));
      gcalAccessToken=resp.access_token;
      sessionStorage.setItem('gcal_token',JSON.stringify({token:gcalAccessToken,expires:Date.now()+((parseInt(resp.expires_in)||3500)*1000)-60000}));
      res();
    };
    gcalTokenClient.requestAccessToken({prompt:gcalAccessToken?'':'consent'});
  });
}

function gcalSignOut(){
  if(gcalAccessToken&&window.google&&google.accounts)google.accounts.oauth2.revoke(gcalAccessToken,()=>{});
  if(window.gapi&&gapi.client)gapi.client.setToken('');
  gcalAccessToken=null;
  gcalCachedCalendarId=null;
  sessionStorage.removeItem('gcal_token');
}

async function ensureTasksCalendar(){
  if(gcalCachedCalendarId)return gcalCachedCalendarId;
  let id=localStorage.getItem('gcal_calendar_id')||'';
  if(id){
    try{await gapi.client.calendar.calendars.get({calendarId:id});gcalCachedCalendarId=id;return id;}
    catch(e){if(e.status===404||e.status===410){localStorage.removeItem('gcal_calendar_id');id='';}else throw e;}
  }
  const lst=await gapi.client.calendar.calendarList.list({maxResults:250});
  const existing=(lst.result.items||[]).find(c=>c.summary===TASKS_CAL_NAME);
  if(existing){localStorage.setItem('gcal_calendar_id',existing.id);gcalCachedCalendarId=existing.id;return existing.id;}
  let tz='Asia/Jerusalem';
  try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz;}catch(_){}
  const created=await gapi.client.calendar.calendars.insert({resource:{summary:TASKS_CAL_NAME,description:'נוצר אוטומטית על ידי אפליקציית המשימות. אירועי משימות מסונכרנים לכאן בלבד.',timeZone:tz}});
  localStorage.setItem('gcal_calendar_id',created.result.id);
  gcalCachedCalendarId=created.result.id;
  return created.result.id;
}

async function gcalListEvents(calId,timeMin,timeMax){
  const resp=await gapi.client.calendar.events.list({calendarId:calId,timeMin:timeMin.toISOString(),timeMax:timeMax.toISOString(),singleEvents:true,orderBy:'startTime',maxResults:250});
  return resp.result.items||[];
}
async function gcalCreateEvent(calId,ev){const r=await gapi.client.calendar.events.insert({calendarId:calId,resource:ev});return r.result;}
async function gcalUpdateEvent(calId,id,ev){const r=await gapi.client.calendar.events.patch({calendarId:calId,eventId:id,resource:ev});return r.result;}
async function gcalDeleteEvent(calId,id){return gapi.client.calendar.events.delete({calendarId:calId,eventId:id});}

function gcalGridRange(){
  const y=calCursor.getFullYear(),m=calCursor.getMonth();
  const first=new Date(y,m,1);
  const gridStart=new Date(y,m,1-first.getDay());
  const gridEnd=new Date(gridStart);gridEnd.setDate(gridStart.getDate()+42);
  return {gridStart,gridEnd};
}
function ymdLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

async function loadCalEvents(){
  calStatus='loading';
  if(S.view==='calendar')renderCalendarMonth(document.getElementById('mn'));
  try{
    await gcalInit();
    if(!gcalAccessToken){calStatus='signedout';if(S.view==='calendar')renderCalendarMonth(document.getElementById('mn'));return;}
    const calId=await ensureTasksCalendar();
    const {gridStart,gridEnd}=gcalGridRange();
    calEvents=await gcalListEvents(calId,gridStart,gridEnd);
    calStatus='ready';
  }catch(e){
    if(e&&e.status===401){gcalAccessToken=null;sessionStorage.removeItem('gcal_token');calStatus='signedout';}
    else{calStatus='error';calError=(e&&(e.result?.error?.message||e.message))||String(e);}
  }
  if(S.view==='calendar')renderCalendarMonth(document.getElementById('mn'));
}

function renderCalendarMonth(mn){
  if(!mn)return;
  const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const weekdays=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  const y=calCursor.getFullYear(),m=calCursor.getMonth();
  const first=new Date(y,m,1);
  const startOffset=first.getDay();
  const todayStr=ymdLocal(new Date());

  let statusEl='';
  if(calStatus==='loading')statusEl='<span class="cal-msg">טוען אירועים...</span>';
  else if(calStatus==='error')statusEl='<span class="cal-msg err" title="'+esc(calError)+'">שגיאה: '+esc(calError.slice(0,60))+'</span>';
  else if(calStatus==='ready')statusEl='<span>'+calEvents.length+' אירועים</span>';
  else if(calStatus==='signedout')statusEl='<span style="color:var(--ink3)">לא מחובר</span>';

  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(y,m,1-startOffset+i);
    const ds=ymdLocal(d);
    const isOther=d.getMonth()!==m;
    const isToday=ds===todayStr;
    const evs=calEvents.filter(ev=>{
      const sd=ev.start.date||(ev.start.dateTime||'').slice(0,10);
      return sd===ds;
    });
    const chips=evs.slice(0,3).map(ev=>{
      const allDay=!!ev.start.date;
      const time=allDay?'':(ev.start.dateTime?new Date(ev.start.dateTime).toTimeString().slice(0,5)+' ':'');
      return `<div class="cal-ev${allDay?' allday':''}" onclick="event.stopPropagation();mEditEvent('${esc(ev.id)}')" title="${esc(ev.summary||'')}">${esc(time)}${esc(ev.summary||'(ללא כותרת)')}</div>`;
    }).join('');
    const more=evs.length>3?`<div class="cal-more" onclick="event.stopPropagation();mDayEvents('${ds}')">+ ${evs.length-3} נוספים</div>`:'';
    cells.push(`<div class="cal-day${isOther?' other':''}${isToday?' today':''}" onclick="mNewEventOnDay('${ds}')"><div class="cal-d-num">${d.getDate()}</div>${chips}${more}</div>`);
  }
  const weekHdr=weekdays.map(w=>`<div class="cal-wd">${w}</div>`).join('');

  const signedIn=!!gcalAccessToken;
  const actionsHtml=signedIn?`
        <div class="cal-nav">
          <button class="btn-ghost" onclick="gcalPrev()" title="חודש קודם">›</button>
          <button class="btn-ghost" onclick="gcalGoToday()">היום</button>
          <button class="btn-ghost" onclick="gcalNext()" title="חודש הבא">‹</button>
        </div>
        <button class="btn-ghost" onclick="loadCalEvents()" title="רענן">↻</button>
        <button class="btn-primary" onclick="mNewEvent()">${IC.plus} אירוע</button>
        <button class="btn-ghost" onclick="mGcalConfig()" title="הגדרות">⚙</button>`:`
        <button class="btn-primary" onclick="gcalDoSignIn()">התחבר ל-Google</button>
        <button class="btn-ghost" onclick="mGcalConfig()" title="הגדרות">⚙</button>`;

  const body=signedIn?`
    <div class="cal-wrap">
      <div class="cal-grid">
        <div class="cal-wd-row">${weekHdr}</div>
        <div class="cal-days">${cells.join('')}</div>
      </div>
    </div>`:`
    <div class="ai-no-key">
      <div style="font-size:32px">🔗</div>
      <p>התחבר ל-Google כדי לצפות באירועי היומן, להוסיף ולערוך אותם מכאן.<br>הגישה מבוקשת ל-Google Calendar בלבד.</p>
      <button class="btn-primary" onclick="gcalDoSignIn()">התחבר ל-Google Calendar</button>
    </div>`;

  mn.innerHTML=`
    <header class="mn-h">
      <div class="mn-h-row">
        <div class="mn-h-l">
          <h1>יומן Google</h1>
          <div class="mn-h-meta"><span>${months[m]} ${y}</span><span style="color:var(--ink3)">·</span>${statusEl}</div>
        </div>
        <div class="mn-h-actions">${actionsHtml}</div>
      </div>
    </header>
    ${body}`;
}

function gcalPrev(){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);calStatus='idle';calEvents=[];render();}
function gcalNext(){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);calStatus='idle';calEvents=[];render();}
function gcalGoToday(){calCursor=new Date();calStatus='idle';calEvents=[];render();}

async function gcalDoSignIn(){
  try{await gcalInit();await gcalSignIn();calStatus='idle';await loadCalEvents();}
  catch(e){
    if(e.message==='NO_CONFIG'){mGcalConfig();return;}
    alert('שגיאה בהתחברות: '+(e.message||e));
  }
}

async function gcalDoSignOut(){gcalSignOut();calEvents=[];calStatus='signedout';cm();render();}

function mGcalConfig(){

function saveGcalConfig(){

function delGcalConfig(){
