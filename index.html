// ===== EVENT MODAL =====
function dtLocalNow(addHours){
  const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+(addHours||0));
  const tz=d.getTimezoneOffset()*60000;
  return new Date(d.getTime()-tz).toISOString().slice(0,16);
}
function mNewEvent(){
  if(!gcalAccessToken){gcalDoSignIn();return;}
  sm(eventModalHtml(null,{summary:'',description:'',start:dtLocalNow(1),end:dtLocalNow(2),allDay:false}));
}
function mNewEventOnDay(dateStr){
  if(!gcalAccessToken){gcalDoSignIn();return;}
  sm(eventModalHtml(null,{summary:'',description:'',start:dateStr+'T09:00',end:dateStr+'T10:00',allDay:false}));
}
function mEditEvent(id){
  const ev=calEvents.find(e=>e.id===id);if(!ev)return;
  const allDay=!!ev.start.date;
  let start,end;
  if(allDay){
    start=ev.start.date;
    const p=(ev.end.date||ev.start.date).split('-').map(Number);
    const dt=new Date(Date.UTC(p[0],p[1]-1,p[2]-1));
    end=dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0');
    if(end<start)end=start;
  }
  else{start=(ev.start.dateTime||'').slice(0,16);end=(ev.end.dateTime||'').slice(0,16);}
  sm(eventModalHtml(id,{summary:ev.summary||'',description:ev.description||'',start,end,allDay,htmlLink:ev.htmlLink}));
}
function eventModalHtml(id,e){
  const title=id?'עריכת אירוע':'אירוע חדש';
  const dtType=e.allDay?'date':'datetime-local';
  return `<h2>${title}</h2>
    <div class="mf"><label>כותרת</label><input id="vE1" value="${esc(e.summary)}" placeholder="כותרת האירוע"/></div>
    <div class="mf"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="vEAD" ${e.allDay?'checked':''} onchange="toggleAllDay()"/> <span>אירוע של יום שלם</span></label></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="mf"><label>התחלה</label><input id="vE2" type="${dtType}" value="${esc(e.start)}"/></div>
      <div class="mf"><label>סיום</label><input id="vE3" type="${dtType}" value="${esc(e.end)}"/></div>
    </div>
    <div class="mf"><label>תיאור</label><textarea id="vE4" rows="3" style="width:100%;padding:7px 9px;border:.5px solid var(--rule2);border-radius:4px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;resize:vertical" placeholder="הערות (אופציונלי)">${esc(e.description)}</textarea></div>
    ${e.htmlLink?'<div style="font-size:11px;color:var(--ink3);margin-top:-4px;margin-bottom:8px"><a href="'+esc(e.htmlLink)+'" target="_blank" style="color:var(--accent)">פתח ב-Google Calendar ↗</a></div>':''}
    <div class="mc-actions">
      <button class="btn-primary" onclick="saveEvent('${id||''}')">שמור</button>
      ${id?'<button class="btn-ghost btn-danger" onclick="deleteEvent(\''+id+'\')">מחק</button>':''}
      <button class="btn-ghost" onclick="cm()">ביטול</button>
    </div>`;
}
function toggleAllDay(){
  const ad=document.getElementById('vEAD').checked;
  const s=document.getElementById('vE2'),e=document.getElementById('vE3');
  const today=new Date().toISOString().split('T')[0];
  if(ad){
    const sd=(s.value||'').split('T')[0]||today;
    const ed=(e.value||'').split('T')[0]||sd;
    s.type='date';e.type='date';s.value=sd;e.value=ed;
  }else{
    const sd=s.value||today;
    s.type='datetime-local';e.type='datetime-local';
    s.value=sd+'T09:00';e.value=sd+'T10:00';
  }
}
async function saveEvent(id){
  const title=document.getElementById('vE1').value.trim();
  if(!title){alert('הזן כותרת');return;}
  const allDay=document.getElementById('vEAD').checked;
  const sVal=document.getElementById('vE2').value;
  const eVal=document.getElementById('vE3').value;
  if(!sVal||!eVal){alert('הזן תאריכי התחלה וסיום');return;}
  const desc=document.getElementById('vE4').value;
  const body={summary:title,description:desc};
  if(allDay){
    body.start={date:sVal};
    const ed=eVal<sVal?sVal:eVal;
    const parts=ed.split('-').map(Number);
    const dt=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]+1));
    const endDate=dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0');
    body.end={date:endDate};
  }else{
    const startD=new Date(sVal),endD=new Date(eVal);
    if(endD<=startD){alert('שעת הסיום חייבת להיות אחרי ההתחלה');return;}
    body.start={dateTime:startD.toISOString()};
    body.end={dateTime:endD.toISOString()};
  }
  try{
    const calId=await ensureTasksCalendar();
    if(id)await gcalUpdateEvent(calId,id,body); else await gcalCreateEvent(calId,body);
    cm();calStatus='idle';await loadCalEvents();
  }catch(err){
    const msg=err&&err.result&&err.result.error&&err.result.error.message||err.message||String(err);
    alert('שגיאה בשמירה: '+msg);
  }
}
async function deleteEvent(id){
  if(!confirm('למחוק את האירוע?'))return;

// ===== TASK <-> CALENDAR SYNC =====
async function _syncTaskCore(task){
  if(!task.dueDate)throw new Error('NO_DATE');
  await gcalInit();
  if(!gcalAccessToken)await gcalSignIn();
  const body={summary:task.title||'(ללא כותרת)',description:stripHtml(task.content||'')||task.notes||''};
  if(task.dueTime&&/^\d{2}:\d{2}$/.test(task.dueTime)){
    const start=new Date(task.dueDate+'T'+task.dueTime+':00');
    const end=new Date(start.getTime()+60*60*1000);
    body.start={dateTime:start.toISOString()};
    body.end={dateTime:end.toISOString()};
  }else{
    body.start={date:task.dueDate};
    const p=task.dueDate.split('-').map(Number);
    const next=new Date(Date.UTC(p[0],p[1]-1,p[2]+1));
    body.end={date:next.getUTCFullYear()+'-'+String(next.getUTCMonth()+1).padStart(2,'0')+'-'+String(next.getUTCDate()).padStart(2,'0')};
  }
  const calId=await ensureTasksCalendar();
  let result;
  if(task.gcalEventId){
    try{result=await gcalUpdateEvent(calId,task.gcalEventId,body);}
    catch(e){if(e.status===404||e.status===410)result=await gcalCreateEvent(calId,body);else throw e;}
  }else{
    result=await gcalCreateEvent(calId,body);
  }
  task.gcalEventId=result.id;
  task.inCal=true;
  return result;
}

async function _unsyncTaskCore(task){
  if(task.gcalEventId){
    await gcalInit();
    if(!gcalAccessToken)await gcalSignIn();
    const calId=await ensureTasksCalendar();
    try{await gcalDeleteEvent(calId,task.gcalEventId);}
    catch(e){if(e.status!==404&&e.status!==410)throw e;}
  }
  delete task.gcalEventId;
  task.inCal=false;
}

async function _createCalEventCore({title,date,time,durationMinutes,description}){
  if(!date)throw new Error('NO_DATE');
  await gcalInit();
  if(!gcalAccessToken)await gcalSignIn();
  const body={summary:title||'(ללא כותרת)',description:description||''};
  if(time&&/^\d{2}:\d{2}$/.test(time)){
    const start=new Date(date+'T'+time+':00');
    const dur=parseInt(durationMinutes)||60;
    const end=new Date(start.getTime()+dur*60000);
    body.start={dateTime:start.toISOString()};
    body.end={dateTime:end.toISOString()};
  }else{
    body.start={date:date};
    const p=date.split('-').map(Number);
    const next=new Date(Date.UTC(p[0],p[1]-1,p[2]+1));
    body.end={date:next.getUTCFullYear()+'-'+String(next.getUTCMonth()+1).padStart(2,'0')+'-'+String(next.getUTCDate()).padStart(2,'0')};
  }
  const calId=await ensureTasksCalendar();
  return await gcalCreateEvent(calId,body);
}

async function syncTaskToCal(taskId){
  const r=findTask(taskId);if(!r)return;
  try{await _syncTaskCore(r.task);}
  catch(e){
    if(e.message==='NO_DATE'){alert('הוסף תאריך יעד למשימה לפני סנכרון ליומן');return;}
    if(e.message==='NO_CONFIG'){alert('הגדר תחילה את החיבור ל-Google Calendar בלשונית "יומן Google"');return;}
    const msg=e&&e.result&&e.result.error&&e.result.error.message||e.message||String(e);
    alert('שגיאה בסנכרון ליומן: '+msg);return;
  }
  sv();
  if(S.view==='calendar'){calStatus='idle';loadCalEvents();}else{render();}
}

async function unsyncTaskFromCal(taskId){
  const r=findTask(taskId);if(!r)return;
  const t=r.task;
  if(!t.gcalEventId&&!t.inCal){return;}
  if(!confirm('להסיר את האירוע מ-Google Calendar?'))return;
  try{await _unsyncTaskCore(t);}
  catch(e){
    const msg=e&&e.result&&e.result.error&&e.result.error.message||e.message||String(e);
    alert('שגיאה במחיקה מהיומן: '+msg);return;
  }
  sv();
  if(S.view==='calendar'){calStatus='idle';loadCalEvents();}else{render();}
}

const DONE_AREA_NAME='הושלמו';
function ensureDoneArea(proj){
  let a=proj.areas.find(x=>x.name===DONE_AREA_NAME);
  if(!a){a={id:uid(),name:DONE_AREA_NAME,tasks:[],isDone:true};proj.areas.push(a);}
  return a;
}
function moveTaskToDoneArea(taskId){
  const r=findTask(taskId);if(!r)return;
  const done=ensureDoneArea(r.proj);
  if(r.area.id===done.id)return;
  r.task._origAreaId=r.area.id;
  r.area.tasks=r.area.tasks.filter(t=>t.id!==taskId);
  done.tasks.push(r.task);
}
function moveTaskFromDoneArea(taskId){
  const r=findTask(taskId);if(!r)return;
  if(r.area.name!==DONE_AREA_NAME)return;
  const orig=r.task._origAreaId?r.proj.areas.find(a=>a.id===r.task._origAreaId):null;
  const target=orig||r.proj.areas.find(a=>a.name!==DONE_AREA_NAME)||r.area;
  if(target.id===r.area.id)return;
  r.area.tasks=r.area.tasks.filter(t=>t.id!==taskId);
  target.tasks.push(r.task);
  delete r.task._origAreaId;
}
function clearDoneInProject(projId){
  const proj=S.projects.find(p=>p.id===projId);if(!proj)return;
  const done=proj.areas.find(a=>a.name===DONE_AREA_NAME);
  if(!done||!done.tasks.length)return;
  if(!confirm('למחוק '+done.tasks.length+' משימות שהושלמו בפרויקט "'+proj.name+'"?'))return;
  done.tasks=[];
  sv();render();
}

function toggleDone(id){
  const r=findTask(id);if(!r)return;
  const becomesDone=r.task.status!=='הושלם';
  r.task.status=becomesDone?'הושלם':'פתוח';
  if(becomesDone)moveTaskToDoneArea(id);
  else moveTaskFromDoneArea(id);
  sv();render();
}
function updTask(id,patch){
  const r=findTask(id);if(!r)return;
  Object.assign(r.task,patch);
  if('status' in patch){
    if(patch.status==='הושלם')moveTaskToDoneArea(id);
    else if(r.area.name===DONE_AREA_NAME)moveTaskFromDoneArea(id);
  }
  sv();render();
}
function updTaskField(id,field,value){const r=findTask(id);if(!r)return;r.task[field]=value;clearTimeout(window._upd);window._upd=setTimeout(()=>{sv();},400);}
function dTask(id){if(!confirm('למחוק משימה?'))return;for(const p of S.projects)p.areas.forEach(a=>{a.tasks=a.tasks.filter(t=>t.id!==id);});if(S.selTaskId===id)S.selTaskId=null;sv();render();}

=== פקודות זמינות ===

עדכון משימה (אחד או כמה שדות בבת אחת):
<ACTION>{"type":"update_task","project":"שם","taskTitle":"כותרת קיימת","updates":{"title":"חדש","priority":"דחוף","importance":"גבוהה","status":"בביצוע","dueDate":"2026-05-20","dueTime":"09:30","assigned":"דני","notes":"..."}}</ACTION>
כל השדות ב-updates אופציונליים — שלח רק את אלה שמשתנים.

עדכון סטטוס בלבד (קיצור):
<ACTION>{"type":"update_status","project":"שם","taskTitle":"כותרת","status":"הושלם"}</ACTION>
status: פתוח/בביצוע/תלוי/הושלם.

מחיקת משימה:
<ACTION>{"type":"delete_task","project":"שם","taskTitle":"כותרת"}</ACTION>

לפני שליחה — וודא שלמשימה יש dueDate. אם המשתמש מבקש סנכרון בלי שיש תאריך, קודם עדכן את התאריך ואז סנכרן (אפשר באותה תשובה).

הסרה מ-Google Calendar:
<ACTION>{"type":"unsync_task_from_cal","project":"שם","taskTitle":"כותרת"}</ACTION>

יצירת אירוע יומן ישיר (לא קשור למשימה — לפגישה, תזכורת וכו'):
<ACTION>{"type":"create_event","title":"שם אירוע","date":"YYYY-MM-DD","time":"HH:MM","durationMinutes":60,"description":""}</ACTION>
time ו-durationMinutes אופציונליים — בלי time = יום שלם.

פרויקט חדש (נוצר עם תחומים: כללי, ביצוע, הזמנות רכש, חשבונות):
<ACTION>{"type":"add_project","name":"שם"}</ACTION>

מחיקת פרויקט (זהירות — מוחק גם את כל המשימות שבו):

שינוי שם פרויקט:
<ACTION>{"type":"rename_project","oldName":"ישן","newName":"חדש"}</ACTION>

<ACTION>{"type":"add_area","project":"שם פרויקט","name":"שם תחום"}</ACTION>

הוספת פתק:

=== כללים ===
- אם חסר מידע חיוני (למשל איזה פרויקט) — שאל שאלה אחת ממוקדת לפני פעולה.
- אפשר להוציא כמה ACTION ברצף באותה תשובה (למשל להוסיף משימה ומיד לסנכרן ליומן).
- לפעולות מסוכנות (מחיקת פרויקט, מחיקת תחום עם משימות) — תזהיר את המשתמש בטקסט לפני הפקודה, או בקש אישור בשאלה.
- ענה תמיד בעברית, בקצרה.`;

  const messages=aiMsgs.filter(m=>!m.loading).map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}));

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:systemPrompt,messages})
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const reply=data.content[0].text;

    aiMsgs=aiMsgs.filter(m=>!m.loading);

    const actionMatches=[...reply.matchAll(/<ACTION>([\s\S]*?)<\/ACTION>/g)];
    let displayReply=reply.replace(/<ACTION>[\s\S]*?<\/ACTION>/g,'').trim();
    const results=[];
    const norm=s=>(s||'').toString().trim();

    const findProj=name=>S.projects.find(p=>norm(p.name)===norm(name));
    const findTaskIn=(proj,title)=>{for(const a of proj.areas){const t=a.tasks.find(t=>norm(t.title)===norm(title));if(t)return{task:t,area:a};}return null;};
    const calErr=e=>{
      if(e.message==='NO_DATE')return 'חסר תאריך יעד';
      if(e.message==='NO_CONFIG')return 'לא מוגדר חיבור ל-Google Calendar';
      return (e&&e.result&&e.result.error&&e.result.error.message)||e.message||String(e);
    };

    for(const match of actionMatches){
      try{
        const action=JSON.parse(match[1].trim());
        if(action.type==='add_task'){
          const proj=findProj(action.project);
          if(!proj){results.push('❌ פרויקט "'+action.project+'" לא נמצא');continue;}
          let area=proj.areas.find(a=>norm(a.name)===norm(action.area));
          let isNewArea=false;
          if(!area){area={id:uid(),name:action.area||'כללי',tasks:[]};proj.areas.push(area);isNewArea=true;}
          area.tasks.push({id:uid(),title:action.title,content:'',notes:action.notes||'',priority:action.priority||'',importance:action.importance||'',status:action.status||'פתוח',assigned:action.assigned||'',dueDate:action.dueDate||'',dueTime:action.dueTime||'',inCal:false,created:new Date().toISOString()});
          results.push('✅ נוספה משימה "'+action.title+'" → '+proj.name+' › '+area.name+(isNewArea?' (תחום חדש!)':''));
        } else if(action.type==='update_task'){
          const proj=findProj(action.project);
          if(!proj){results.push('❌ פרויקט "'+action.project+'" לא נמצא');continue;}
          const found=findTaskIn(proj,action.taskTitle);
          if(!found){results.push('❌ משימה "'+action.taskTitle+'" לא נמצאה ב-'+proj.name);continue;}
          const updates=action.updates||{};
          const allowed=['title','priority','importance','status','dueDate','dueTime','assigned','notes','content'];
          const applied=[];
          for(const k of allowed){if(k in updates){found.task[k]=updates[k];applied.push(k);}}
          if('status' in updates){
            if(updates.status==='הושלם')moveTaskToDoneArea(found.task.id);
            else if(found.area.name===DONE_AREA_NAME)moveTaskFromDoneArea(found.task.id);
          }
          results.push(applied.length?'✅ "'+action.taskTitle+'" עודכן ('+applied.join(', ')+')':'⚠️ אין שינויים ב-"'+action.taskTitle+'"');
        } else if(action.type==='update_status'){
          const proj=findProj(action.project);
          if(!proj){results.push('❌ פרויקט "'+action.project+'" לא נמצא');continue;}
          const found=findTaskIn(proj,action.taskTitle);
          if(!found){results.push('❌ משימה "'+action.taskTitle+'" לא נמצאה ב-'+proj.name);continue;}
          found.task.status=action.status;
          if(action.status==='הושלם')moveTaskToDoneArea(found.task.id);
          else if(found.area.name===DONE_AREA_NAME)moveTaskFromDoneArea(found.task.id);
          results.push('✅ "'+action.taskTitle+'" → '+action.status);
        } else if(action.type==='add_project'){
          const exists=findProj(action.name);
          if(exists){results.push('❌ פרויקט "'+action.name+'" כבר קיים');continue;}
          const id=uid();
          const defs=[{id:uid(),name:'כללי',tasks:[]},{id:uid(),name:'ביצוע',tasks:[]},{id:uid(),name:'הזמנות רכש',tasks:[]},{id:uid(),name:'חשבונות',tasks:[]}];
          S.projects.push({id,name:action.name,areas:defs});
          results.push('✅ נוסף פרויקט "'+action.name+'"');
        } else if(action.type==='delete_project'){
          const idx=S.projects.findIndex(p=>norm(p.name)===norm(action.name));
          if(idx<0){results.push('❌ פרויקט "'+action.name+'" לא נמצא');continue;}
          const removed=S.projects.splice(idx,1)[0];
          if(S.apid===removed.id){S.apid=null;S.aaid=null;S.view='dashboard';}
          results.push('🗑 נמחק פרויקט "'+removed.name+'"');
        } else if(action.type==='rename_project'){
          const proj=findProj(action.oldName);
          if(!proj){results.push('❌ פרויקט "'+action.oldName+'" לא נמצא');continue;}
          if(findProj(action.newName)){results.push('❌ כבר קיים פרויקט "'+action.newName+'"');continue;}
          proj.name=action.newName;
          results.push('✏️ "'+action.oldName+'" → "'+action.newName+'"');
        } else if(action.type==='add_area'){
          const proj=findProj(action.project);
          if(!proj){results.push('❌ פרויקט "'+action.project+'" לא נמצא');continue;}
          if(proj.areas.find(a=>norm(a.name)===norm(action.name))){results.push('❌ תחום "'+action.name+'" כבר קיים');continue;}
          proj.areas.push({id:uid(),name:action.name,tasks:[]});
          results.push('✅ נוסף תחום "'+action.name+'" ל-'+proj.name);
        } else if(action.type==='delete_area'){
          const proj=findProj(action.project);
          if(!proj){results.push('❌ פרויקט "'+action.project+'" לא נמצא');continue;}
          const idx=proj.areas.findIndex(a=>norm(a.name)===norm(action.areaName));
          if(idx<0){results.push('❌ תחום "'+action.areaName+'" לא נמצא');continue;}
          if(proj.areas.length<=1){results.push('❌ אי אפשר למחוק את התחום היחיד בפרויקט');continue;}
          const cnt=proj.areas[idx].tasks.length;
          proj.areas.splice(idx,1);
          if(S.aaid===proj.areas[idx]?.id)S.aaid='__all__';
          results.push('🗑 נמחק תחום "'+action.areaName+'"'+(cnt?' ('+cnt+' משימות)':''));
        } else if(action.type==='delete_task'){
          const proj=findProj(action.project);
          if(!proj){results.push('❌ פרויקט "'+action.project+'" לא נמצא');continue;}
          let found=false;
          for(const a of proj.areas){
            const idx=a.tasks.findIndex(t=>norm(t.title)===norm(action.taskTitle));
            if(idx>=0){a.tasks.splice(idx,1);results.push('✅ נמחקה "'+action.taskTitle+'"');found=true;break;}
          }
          if(!found)results.push('❌ משימה "'+action.taskTitle+'" לא נמצאה');
        } else if(action.type==='sync_task_to_cal'){
          const proj=findProj(action.project);
          if(!proj){results.push('❌ פרויקט "'+action.project+'" לא נמצא');continue;}
          const found=findTaskIn(proj,action.taskTitle);
          if(!found){results.push('❌ משימה "'+action.taskTitle+'" לא נמצאה');continue;}
          try{await _syncTaskCore(found.task);results.push('📅 "'+action.taskTitle+'" נשלחה ליומן Google');}
          catch(e){results.push('❌ סנכרון "'+action.taskTitle+'" נכשל: '+calErr(e));}
        } else if(action.type==='unsync_task_from_cal'){
          const proj=findProj(action.project);
          if(!proj){results.push('❌ פרויקט "'+action.project+'" לא נמצא');continue;}
          const found=findTaskIn(proj,action.taskTitle);
          if(!found){results.push('❌ משימה "'+action.taskTitle+'" לא נמצאה');continue;}
          try{await _unsyncTaskCore(found.task);results.push('🗑 "'+action.taskTitle+'" הוסרה מהיומן');}
          catch(e){results.push('❌ הסרה נכשלה: '+calErr(e));}
        } else if(action.type==='create_event'){
          try{await _createCalEventCore(action);results.push('📅 אירוע "'+action.title+'" נוצר ב-'+action.date+(action.time?' '+action.time:'')); if(S.view==='calendar'){calStatus='idle';loadCalEvents();}}
          catch(e){results.push('❌ יצירת אירוע נכשלה: '+calErr(e));}
        } else if(action.type==='add_note'){
          const text=(action.text||'').trim();
          if(!text){results.push('❌ פתק ריק');continue;}
          S.notes.unshift({id:uid(),text,content:'',done:false,created:new Date().toISOString()});
          results.push('📝 נוסף פתק');
        } else {
          results.push('❌ סוג פקודה לא מוכר: '+action.type);
        }
      }catch(e){results.push('❌ שגיאה בפענוח פקודה');console.error(e);}
    }
    if(results.length){await sv();displayReply=(displayReply?displayReply+'\n\n':'')+results.join('\n');}
    aiMsgs.push({role:'ai',content:displayReply||'(אין תשובה)'});
  }catch(e){
    aiMsgs=aiMsgs.filter(m=>!m.loading);
    aiMsgs.push({role:'ai',content:'שגיאה: '+(e.message||'בעיה בחיבור ל-API')});
  }
  render();
  if(btn)btn.disabled=false;
}

// ===== EXPORTS =====
function xCSV(){const p=ap();if(!p){alert('בחר פרויקט');return;}let rows=[['פרויקט','תחום','כותרת','הערות','עדיפות','חשיבות','סטטוס','אחראי','תאריך יעד']];p.areas.forEach(a=>a.tasks.forEach(t=>rows.push([p.name,a.name,t.title,stripHtml(t.content||'')||t.notes||'',t.priority,t.importance,t.status,t.assigned,t.dueDate])));const csv=rows.map(r=>r.map(x=>'"'+(x||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');const el=document.createElement('a');el.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));el.download=p.name+'.csv';el.click();}
function xJSON(){const p=ap();if(!p){alert('בחר פרויקט');return;}const el=document.createElement('a');el.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));el.download=p.name+'.json';el.click();}

onSnapshot(doc(db,'data','avihai'),async(snap)=>{
  if(snap.exists()){
    S.projects=snap.data().projects||[];
    S.notes=snap.data().notes||[];
    syncOk=true;
    let migrated=false;
    S.projects.forEach(p=>p.areas.forEach(a=>a.tasks.forEach(t=>{
      if(t.notes&&!t.content){t.content=esc(t.notes).replace(/\n/g,'<br>');t.notes='';migrated=true;}
    })));
    if(migrated)await sv();
  } else {
    S.projects=SEED;S.notes=[];await sv();
  }
  render();
});

  if(sb.classList.contains('open')&&!sb.contains(e.target)&&!burger.contains(e.target))sb.classList.remove('open');
