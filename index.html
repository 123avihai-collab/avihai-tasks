<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>אביחי משימות</title>
<meta name="theme-color" content="#1a1a18"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="משימות"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;direction:rtl;background:#f0ede8;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:16px}
:root{--bg1:#fff;--bg2:#f5f3ef;--t1:#1a1a18;--t2:#6b6b67;--t3:#aaa9a5;--b2:rgba(0,0,0,.22);--b3:rgba(0,0,0,.12);--rm:8px;--rl:12px}
@media(prefers-color-scheme:dark){body{background:#111}:root{--bg1:#1e1e1c;--bg2:#2a2a28;--t1:#f0ede8;--t2:#9a9994;--t3:#5a5956;--b2:rgba(255,255,255,.18);--b3:rgba(255,255,255,.1)}}
#root{display:flex;width:100%;max-width:960px;height:calc(100vh - 32px);max-height:700px;border:.5px solid var(--b2);border-radius:var(--rl);overflow:hidden;background:var(--bg1);position:relative}
#sb{width:195px;min-width:195px;display:flex;flex-direction:column;background:var(--bg2);border-left:.5px solid var(--b3);overflow:hidden}
.sbh{padding:10px 12px;border-bottom:.5px solid var(--b3)}
.sbh-t{font-size:14px;font-weight:600;color:var(--t1)}
.sbh-s{font-size:11px;color:var(--t2);margin-top:2px}
.pl{flex:1;overflow-y:auto;padding:4px 0}
.pl-sec{padding:6px 12px 2px;font-size:10px;color:var(--t3);letter-spacing:.5px;font-weight:600}
.pi{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--t2);gap:6px}
.pi:hover{background:rgba(0,0,0,.04)}
.pi.act{background:var(--bg1);color:var(--t1);font-weight:500;border-right:2px solid var(--t1)}
.pi-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-c{font-size:10px;padding:1px 6px;border-radius:99px;min-width:18px;text-align:center;background:var(--bg1);color:var(--t2)}
.pi.act .pi-c{background:#E6F1FB;color:#185FA5}
.pi-cred{background:#FCEBEB!important;color:#A32D2D!important}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#3B6D11;flex-shrink:0}
.sync-dot.off{background:#E24B4A}
.sbf{padding:8px;border-top:.5px solid var(--b3);display:flex;flex-direction:column;gap:5px}
.sbb{font-size:12px;padding:5px 8px;border-radius:var(--rm);border:.5px solid var(--b2);background:var(--bg1);color:var(--t2);cursor:pointer;width:100%;text-align:center}
.sbb:hover{background:var(--bg2)}
.sbr{display:flex;gap:5px}.sbr .sbb{flex:1}
.ai-btn{font-size:12px;padding:6px 8px;border-radius:var(--rm);border:none;background:var(--t1);color:var(--bg1);cursor:pointer;width:100%;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}
.ai-btn:hover{opacity:.85}
.usr{display:flex;align-items:center;gap:7px;padding:4px 2px}
.av{width:26px;height:26px;border-radius:50%;background:#E6F1FB;color:#185FA5;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.usr span{font-size:12px;color:var(--t2)}
#mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.mnh{padding:10px 16px;border-bottom:.5px solid var(--b3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px}
.mnh-t{font-size:16px;font-weight:600;color:var(--t1)}
.mnh-s{font-size:12px;color:var(--t2);margin-top:1px}
.hb{font-size:11px;padding:4px 10px;border-radius:var(--rm);border:.5px solid var(--b2);background:var(--bg1);color:var(--t2);cursor:pointer}
.hb:hover{background:var(--bg2)}
.tabs{display:flex;align-items:stretch;border-bottom:.5px solid var(--b3);padding:0 10px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb-wrap{display:flex;align-items:stretch}
.tb-wrap.act .tb-edit{display:flex}
.tb{padding:8px 10px;font-size:13px;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px;user-select:none}
.tb:hover{color:var(--t1)}
.tb-wrap.act .tb{color:var(--t1);border-bottom-color:var(--t1);font-weight:500}
.tb-b{font-size:10px;background:#E6F1FB;color:#185FA5;border-radius:99px;padding:1px 6px}
.tb-edit{display:none;align-items:center;padding:0 4px 2px 0;border:none;background:none;color:var(--t3);font-size:13px;cursor:pointer;border-bottom:2px solid var(--t1)}
.tb-add{padding:8px 6px;font-size:18px;cursor:pointer;color:var(--t3);border-bottom:2px solid transparent;display:flex;align-items:center}
.tl{flex:1;overflow-y:auto;padding:8px 12px}
.tc{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border:.5px solid var(--b3);border-radius:var(--rm);margin-bottom:7px;background:var(--bg1);cursor:pointer}
.tc:hover{border-color:var(--b2)}
.tc-l{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px;flex-shrink:0}
.tc-ic{width:14px;height:12px;display:flex;flex-direction:column;justify-content:space-between;opacity:.35}
.tc-ic i{display:block;height:2px;background:currentColor;border-radius:1px}
.tc-x{border:none;background:none;cursor:pointer;color:var(--t3);font-size:13px;line-height:1;padding:0;width:14px;text-align:center}
.tc-x:hover{color:#A32D2D}
.tc-b{flex:1;min-width:0}
.tc-t{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-notes{font-size:11px;color:var(--t2);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.tc-bds{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tc-created{font-size:10px;color:var(--t3);margin-top:5px;font-feature-settings:"tnum"}
.bd{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap}
.r{background:#FCEBEB;color:#A32D2D}.am{background:#FAEEDA;color:#854F0B}.gn{background:#EAF3DE;color:#3B6D11}.bl{background:#E6F1FB;color:#185FA5}
.gy{background:var(--bg2);color:var(--t2);border:.5px solid var(--b3)}
.cal-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#1D9E75;margin-right:3px;vertical-align:middle}
.ab{padding:8px 12px;border-top:.5px solid var(--b3);flex-shrink:0}
.ai-inp{width:100%;font-size:13px;padding:7px 12px;border:.5px solid var(--b3);border-radius:var(--rm);background:var(--bg2);color:var(--t3);text-align:right;direction:rtl;cursor:pointer;outline:none}
.emp{text-align:center;padding:3rem 0;color:var(--t3);font-size:13px;line-height:2}
.nop{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--t3);font-size:14px}
.loading{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t3)}
#mr{position:absolute;inset:0;z-index:100;pointer-events:none}
#mr.on{pointer-events:all}
.mbg{width:100%;height:100%;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.mc{background:var(--bg1);border-radius:var(--rl);border:.5px solid var(--b2);padding:1.1rem 1.25rem;width:100%;max-width:460px;max-height:96%;overflow-y:auto}
.mc h2{font-size:15px;font-weight:600;margin-bottom:.85rem;color:var(--t1)}
.f{margin-bottom:.6rem}
.f label{display:block;font-size:12px;color:var(--t2);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;font-size:13px;padding:5px 9px;border-radius:var(--rm);border:.5px solid var(--b2);background:var(--bg1);color:var(--t1);direction:rtl}
.f textarea{min-height:50px;resize:vertical}
.opt-grp{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.opt{font-size:12px;padding:6px 13px;border-radius:99px;border:1px solid var(--b3);background:var(--bg1);color:var(--t2);cursor:pointer;transition:all .12s;white-space:nowrap;font-family:inherit}
.opt:hover{border-color:var(--b2)}
.opt.opt-add{font-size:11px;color:var(--t3);border-style:dashed}
.opt.opt-add:hover{color:var(--t1);border-color:var(--t1)}
.opt-none.active{background:#6b6b67;color:#fff;border-color:#6b6b67}
.opt-r{color:#A32D2D}
.opt-r.active{background:#FCEBEB;color:#A32D2D;border-color:#A32D2D;font-weight:600}
.opt-am{color:#854F0B}
.opt-am.active{background:#FAEEDA;color:#854F0B;border-color:#854F0B;font-weight:600}
.opt-gn{color:#3B6D11}
.opt-gn.active{background:#EAF3DE;color:#3B6D11;border-color:#3B6D11;font-weight:600}
.opt-bl{color:#185FA5}
.opt-bl.active{background:#E6F1FB;color:#185FA5;border-color:#185FA5;font-weight:600}
.opt-gy.active{background:var(--bg2);color:var(--t1);border-color:var(--t1);font-weight:600}
.rt-toolbar{display:flex;gap:2px;background:var(--bg2);border:.5px solid var(--b2);border-radius:var(--rm) var(--rm) 0 0;padding:4px 6px;border-bottom:none}
.rt-btn{font-size:13px;padding:4px 9px;border:none;background:transparent;color:var(--t2);cursor:pointer;border-radius:4px;min-width:28px;font-family:inherit}
.rt-btn:hover{background:var(--bg1);color:var(--t1)}
.rt-content{min-height:120px;max-height:240px;overflow-y:auto;padding:9px 12px;border:.5px solid var(--b2);border-radius:0 0 var(--rm) var(--rm);background:var(--bg1);color:var(--t1);direction:rtl;text-align:right;font-size:13px;line-height:1.55;outline:none}
.rt-content:focus{border-color:var(--t2)}
.rt-content:empty:before{content:attr(data-placeholder);color:var(--t3);pointer-events:none}
.rt-content ul,.rt-content ol{padding-right:22px;margin:4px 0}
.rt-content b,.rt-content strong{font-weight:700}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.divider{border:none;border-top:.5px solid var(--b3);margin:.7rem 0}
.gcal-box{padding:10px 12px;border:.5px solid var(--b3);border-radius:var(--rm);background:var(--bg2)}
.gcal-box-title{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:5px}
.gcal-note{font-size:11px;color:var(--t3);margin-bottom:8px;line-height:1.5}
.gcal-btn{font-size:12px;padding:5px 14px;border-radius:var(--rm);border:.5px solid var(--b2);background:var(--bg1);color:var(--t2);cursor:pointer;text-decoration:none;display:inline-block}
.gcal-btn:hover{background:#EAF3DE;color:#3B6D11;border-color:#97C459}
.ma{display:flex;gap:7px;margin-top:.8rem;flex-wrap:wrap}
.bp{background:var(--t1);color:var(--bg1);border:none;padding:6px 16px;border-radius:var(--rm);font-size:13px;cursor:pointer}
.bs{background:transparent;color:var(--t2);border:.5px solid var(--b2);padding:6px 14px;border-radius:var(--rm);font-size:13px;cursor:pointer}
.bs:hover{background:var(--bg2)}
.bd-del{color:#A32D2D;border-color:#F0959580}
.cb{width:20px;height:20px;border:1.5px solid var(--b2);border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg1);transition:all .12s;margin-top:1px;padding:0}
.cb:hover{border-color:var(--t1);background:var(--bg2)}
.cb.done{background:#3B6D11;border-color:#3B6D11}
.cb.done::after{content:'✓';color:#fff;font-size:13px;font-weight:bold;line-height:1}
.tc.done .tc-t,.dk.done .dk-t{text-decoration:line-through;color:var(--t2)}
.tc.done,.dk.done{opacity:.6}
.tc-move{border:none;background:none;cursor:pointer;color:var(--t3);font-size:14px;padding:0;width:14px;text-align:center;line-height:1}
.tc-move:hover{color:#185FA5}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.35}
.tc-area-tag{font-size:10px;padding:1px 7px;border-radius:99px;background:#E6F1FB;color:#185FA5;font-weight:500}
.tb-wrap.all .tb{font-weight:600}
.tb-wrap.all .tb-b{background:#3B6D11;color:#fff}
.tb-wrap.drop-target .tb{background:#EAF3DE;color:#3B6D11;border-bottom-color:#3B6D11}
.move-pop{position:fixed;background:var(--bg1);border:.5px solid var(--b2);border-radius:var(--rm);padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:200;min-width:150px;max-width:220px}
.move-pop-h{font-size:10px;color:var(--t3);padding:5px 8px 4px;border-bottom:.5px solid var(--b3);margin-bottom:3px;letter-spacing:.3px}
.move-pop-i{display:block;width:100%;text-align:right;background:none;border:none;padding:7px 10px;font-size:12px;color:var(--t1);cursor:pointer;border-radius:4px;direction:rtl}
.move-pop-i:hover{background:var(--bg2)}
.notes-add{padding:10px 14px;border-bottom:.5px solid var(--b3);flex-shrink:0}
.notes-add input{width:100%;font-size:13px;padding:8px 12px;border:.5px solid var(--b2);border-radius:var(--rm);background:var(--bg2);color:var(--t1);direction:rtl;outline:none}
.notes-add input:focus{border-color:var(--t2);background:var(--bg1)}
.notes-list{flex:1;overflow-y:auto;padding:8px 14px}
.note{border:.5px solid var(--b3);border-radius:var(--rm);margin-bottom:6px;background:var(--bg1);overflow:hidden}
.note:hover{border-color:var(--b2)}
.note.dragging{opacity:.4}
.note.done{opacity:.65}
.note.done .note-input{text-decoration:line-through;color:var(--t2)}
.note-row{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:grab}
.note-input{flex:1;font-size:13px;padding:4px 6px;border:none;background:transparent;color:var(--t1);direction:rtl;outline:none;min-width:0}
.note-input:focus{background:var(--bg2);border-radius:4px}
.note-toggle{border:none;background:none;cursor:pointer;color:var(--t3);font-size:12px;line-height:1;padding:3px 7px;flex-shrink:0;transition:transform .15s;border-radius:4px}
.note-toggle:hover{color:var(--t1);background:var(--bg2)}
.note-toggle.open{transform:rotate(180deg)}
.note-toggle.has-text{color:#185FA5}
.note-x{border:none;background:none;cursor:pointer;color:var(--t3);font-size:13px;line-height:1;padding:0;width:20px;text-align:center;flex-shrink:0}
.note-x:hover{color:#A32D2D}
.note-extra{display:none;padding:8px 10px 10px;border-top:.5px solid var(--b3);background:var(--bg2)}
.note-extra.open{display:block}
.note-textarea{width:100%;font-size:12px;padding:7px 9px;border:.5px solid var(--b3);border-radius:6px;background:var(--bg1);color:var(--t1);direction:rtl;outline:none;min-height:80px;resize:vertical;font-family:inherit;line-height:1.55}
.note-textarea:focus{border-color:var(--t2)}
.notes-sep{font-size:10px;color:var(--t3);padding:10px 4px 4px;letter-spacing:.5px}
.pi.drop-target{background:#EAF3DE!important;color:#3B6D11!important;font-weight:600;border-right:2px solid #3B6D11}
.pi[draggable="true"]{cursor:grab}
.pi.dragging{opacity:.4}
.pi.drop-before{box-shadow:inset 0 2px 0 0 #185FA5}
.pi.drop-after{box-shadow:inset 0 -2px 0 0 #185FA5}
.ab-row{display:flex;gap:6px}
.ab-task{flex:1;font-size:13px;padding:8px 10px;border:.5px solid var(--b3);border-radius:var(--rm);background:var(--bg2);color:var(--t1);cursor:pointer;text-align:center}
.ab-task:hover{background:var(--bg1);border-color:var(--b2)}
.ab-ai{flex:1;font-size:13px;padding:8px 10px;border:none;border-radius:var(--rm);background:var(--t1);color:var(--bg1);cursor:pointer;text-align:center}
.ab-ai:hover{opacity:.85}
.dash-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.dash-body{flex:1;overflow-y:auto;padding:12px 14px}
.dash-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.sc{border-radius:var(--rm);padding:10px 12px;background:var(--bg2)}
.sc.red{background:#FCEBEB}.sc.od{background:#FAEEDA}
.sc-n{font-size:22px;font-weight:600;color:var(--t1);line-height:1}
.sc.red .sc-n{color:#A32D2D}.sc.od .sc-n{color:#854F0B}
.sc-l{font-size:11px;color:var(--t2);margin-top:3px}
.dash-filter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fb{font-size:12px;padding:4px 12px;border-radius:99px;border:.5px solid var(--b2);background:var(--bg1);color:var(--t2);cursor:pointer}
.fb.on{background:var(--t1);color:var(--bg1);border-color:var(--t1)}
.dash-empty{text-align:center;padding:2.5rem 0;color:var(--t3);font-size:13px;line-height:2}
.dk{border:.5px solid var(--b3);margin-bottom:8px;background:var(--bg1);overflow:hidden;border-radius:var(--rm)}
.dk:hover{border-color:var(--b2)}
.dk.u{border-right:3px solid #E24B4A;border-radius:0}.dk.h{border-right:3px solid #EF9F27;border-radius:0}
.dk-top{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;cursor:pointer}
.dk-b{flex:1;min-width:0}
.dk-t{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-notes{font-size:11px;color:var(--t2);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dk-proj{font-size:11px;color:var(--t2);background:var(--bg2);padding:2px 8px;border-radius:99px;border:.5px solid var(--b3);white-space:nowrap}
.dk-edit-btn{font-size:11px;padding:4px 10px;border-radius:var(--rm);border:.5px solid var(--b2);background:var(--bg2);color:var(--t2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.dk-sb{display:none;border-top:.5px solid var(--b3);padding:8px 12px;background:var(--bg2);align-items:center;gap:6px;flex-wrap:wrap}
.dk-sb.open{display:flex}
.sb-lbl{font-size:11px;color:var(--t2);flex-shrink:0}
.sb-btn{font-size:11px;padding:3px 10px;border-radius:99px;border:.5px solid var(--b2);background:var(--bg1);color:var(--t2);cursor:pointer}
.sb-btn.cur{background:var(--t1);color:var(--bg1);border-color:var(--t1)}
.sb-btn.cur.done{background:#3B6D11;border-color:#3B6D11}
.od-mark{color:#A32D2D!important;border-color:#F09595!important}
/* AI CHAT */
.ai-view{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ai-hd{padding:10px 16px;border-bottom:.5px solid var(--b3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ai-hd-t{font-size:15px;font-weight:600;color:var(--t1)}
.ai-hd-s{font-size:11px;color:var(--t2);margin-top:2px}
.ai-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:var(--rl);font-size:13px;line-height:1.5}
.msg.user{background:var(--t1);color:var(--bg1);align-self:flex-start;border-radius:var(--rl) var(--rl) var(--rl) 4px}
.msg.ai{background:var(--bg2);color:var(--t1);align-self:flex-end;border-radius:var(--rl) var(--rl) 4px var(--rl);border:.5px solid var(--b3)}
.msg.ai.loading{color:var(--t3);font-style:italic}
.ai-foot{padding:10px 12px;border-top:.5px solid var(--b3);display:flex;gap:8px;flex-shrink:0}
.ai-text{flex:1;font-size:13px;padding:8px 12px;border:.5px solid var(--b2);border-radius:var(--rm);background:var(--bg1);color:var(--t1);direction:rtl;outline:none;resize:none;height:38px;min-height:38px}
.ai-text:focus{border-color:var(--t2)}
.ai-send{font-size:13px;padding:8px 14px;border-radius:var(--rm);border:none;background:var(--t1);color:var(--bg1);cursor:pointer;flex-shrink:0}
.ai-send:hover{opacity:.85}
.ai-send:disabled{opacity:.4;cursor:not-allowed}
.ai-no-key{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:2rem;text-align:center}
.ai-no-key p{font-size:13px;color:var(--t2);line-height:1.6}
.ai-welcome{text-align:center;color:var(--t3);font-size:12px;padding:1rem 0;line-height:1.8}

<script type="module">

import{getFirestore,doc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyAwaErTAz0LAYHLEIQbxWY9ir6MzvaYQUo",authDomain:"avihai-tasks.firebaseapp.com",projectId:"avihai-tasks",storageBucket:"avihai-tasks.firebasestorage.app",messagingSenderId:"155180192399",appId:"1:155180192399:web:f7c54231070047fdcfd6fa"};
const SEED=[{"id":"ce6c92303f3","name":"2253","areas":[{"id":"563b210bd23","name":"כללי","tasks":[]},{"id":"7c80056e5c1","name":"ביצוע","tasks":[{"id":"74ef251bece","title":"להשלים חוסרים בשוחות","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"5ee04bac924","title":"להשלים אנקס","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"d3408386f5c","title":"להשלים מבנה אחזקה","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"c3776843903","title":"לסיים אנגרים","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"420b37eef78","title":"תיקוני צבע","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"1296bb8b371","title":"סגירת ברגים","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"c38e8ebb87a","title":"סיום תמיכות","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"}]},{"id":"f55427c8386","name":"הזמנות רכש","tasks":[{"id":"975eea68565","title":"להזמין ברזי מחט","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"04b3d999d6a","title":"להזמין שעוני לחץ","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"}]},{"id":"5fb5abf602b","name":"חשבונות","tasks":[{"id":"1f37d5e897f","title":"להכין חשבון מס 8","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"919dabd031e","title":"להפריד שעות רג'י על פי סעיפים מאלכס","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"787cd9e915a","title":"להפריד את החריגים","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"},{"id":"fa3645711e8","title":"לנסות ולעדכן את הקובץ הראשי של כתב הכמויות","content":"","notes":"","priority":"","importance":"","status":"פתוח","assigned":"","dueDate":"","inCal":false,"created":"2026-04-06"}]}]},{"id":"8b6dd7db9af","name":"908","areas":[{"id":"04e24759e3f","name":"כללי","tasks":[]},{"id":"7a3465db649","name":"ביצוע","tasks":[]},{"id":"668319f9c25","name":"הזמנות רכש","tasks":[]},{"id":"caaeb4b4b6f","name":"חשבונות","tasks":[]}]},{"id":"1a3f91fead9","name":"2242","areas":[{"id":"f6c672d1ef3","name":"כללי","tasks":[]},{"id":"0d2f9b693a9","name":"ביצוע","tasks":[]},{"id":"ba6e2a1ca47","name":"הזמנות רכש","tasks":[]},{"id":"762a171f99a","name":"חשבונות","tasks":[]}]},{"id":"c3614206a44","name":"2288","areas":[{"id":"e8fb2c4fecf","name":"כללי","tasks":[]},{"id":"e37dfb5a119","name":"ביצוע","tasks":[]},{"id":"69253140d1f","name":"הזמנות רכש","tasks":[]},{"id":"e2cb56db17c","name":"חשבונות","tasks":[]}]},{"id":"f976b57bb9d","name":"2306","areas":[{"id":"554d5910d6f","name":"כללי","tasks":[]},{"id":"1fd3dbc73ac","name":"ביצוע","tasks":[]},{"id":"ba1b5163ed3","name":"הזמנות רכש","tasks":[]},{"id":"5e7135632c4","name":"חשבונות","tasks":[]}]},{"id":"25db67c5657","name":"2196","areas":[{"id":"8799b97fd71","name":"כללי","tasks":[]},{"id":"889c9adc496","name":"ביצוע","tasks":[]},{"id":"ed75fe2b17c","name":"הזמנות רכש","tasks":[]},{"id":"2f836c44125","name":"חשבונות","tasks":[]}]}];
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const S={projects:[],notes:[],apid:null,aaid:null,view:'dash',aiProjId:null};
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ap=()=>S.projects.find(p=>p.id===S.apid)||null;
const aa=()=>{const p=ap();return p?p.areas.find(a=>a.id===S.aaid)||null:null;};
const ptc=p=>p.areas.reduce((s,a)=>s+a.tasks.length,0);
const pc=v=>v==='דחוף'?'r':v==='נמוך'?'gn':'am';
function findTask(id){for(const p of S.projects)for(const a of p.areas){const t=a.tasks.find(t=>t.id===id);if(t)return{task:t,proj:p,area:a};}return null;}
function gcalUrl(t){const ti=encodeURIComponent(t.title);const de=encodeURIComponent(stripHtml(t.content||'')||t.notes||'');let dt='';if(t.dueDate){const d=t.dueDate.replace(/-/g,'');const e=new Date(t.dueDate+'T12:00:00');e.setDate(e.getDate()+1);const es=e.toISOString().split('T')[0].replace(/-/g,'');dt='&dates='+d+'/'+es;}return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+ti+dt+'&details='+de;}
function isOverdue(due){if(!due)return false;return new Date(due)<new Date(new Date().toDateString());}
const STATUSES=['פתוח','בביצוע','תלוי','הושלם'];
let dashFilter='active',syncOk=false;
const expandedNotes=new Set();
function fmtCreated(iso){if(!iso)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y;}try{const d=new Date(iso);if(isNaN(d))return iso;const dd=String(d.getDate()).padStart(2,'0');const mm=String(d.getMonth()+1).padStart(2,'0');const yy=d.getFullYear();const hh=String(d.getHours()).padStart(2,'0');const mn=String(d.getMinutes()).padStart(2,'0');return dd+'/'+mm+'/'+yy+' '+hh+':'+mn;}catch(e){return iso;}}
let aiMsgs=[];

// API Key management - stored in localStorage only, never in code
function getApiKey(){return localStorage.getItem('anthropic_api_key')||'';}
function setApiKey(k){localStorage.setItem('anthropic_api_key',k);}

async function sv(){try{await setDoc(doc(db,'data','avihai'),{projects:S.projects,notes:S.notes,updated:Date.now()});syncOk=true;}catch(e){syncOk=false;}updateDot();}
function updateDot(){const d=document.getElementById('sdot');if(d){d.className='sync-dot'+(syncOk?'':' off');d.title=syncOk?'מסונכרן':'לא מחובר';}}
function render(){rSb();S.view==='dash'?rDash():S.view==='ai'?rAI():S.view==='notes'?rNotes():rMn();}

function getUrgentTasks(){const all=[];for(const p of S.projects)for(const a of p.areas)for(const t of a.tasks){const isU=t.priority==='דחוף',isH=t.importance==='גבוהה';if(isU||isH)all.push({task:t,proj:p,area:a,isU,isH});}all.sort((a,b)=>{if(a.task.status==='הושלם'&&b.task.status!=='הושלם')return 1;if(b.task.status==='הושלם'&&a.task.status!=='הושלם')return -1;const oa=isOverdue(a.task.dueDate)&&a.task.status!=='הושלם',ob=isOverdue(b.task.dueDate)&&b.task.status!=='הושלם';if(oa&&!ob)return -1;if(ob&&!oa)return 1;const wa=(a.isU?2:0)+(a.isH?1:0),wb=(b.isU?2:0)+(b.isH?1:0);if(wb!==wa)return wb-wa;if(a.task.dueDate&&b.task.dueDate)return a.task.dueDate.localeCompare(b.task.dueDate);return a.task.dueDate?-1:b.task.dueDate?1:0;});return all;}
function getAllTasks(){const all=[];for(const p of S.projects)for(const a of p.areas)for(const t of a.tasks){const isU=t.priority==='דחוף',isH=t.importance==='גבוהה';all.push({task:t,proj:p,area:a,isU,isH});}all.sort((a,b)=>{if(a.task.status==='הושלם'&&b.task.status!=='הושלם')return 1;if(b.task.status==='הושלם'&&a.task.status!=='הושלם')return -1;const oa=isOverdue(a.task.dueDate)&&a.task.status!=='הושלם',ob=isOverdue(b.task.dueDate)&&b.task.status!=='הושלם';if(oa&&!ob)return -1;if(ob&&!oa)return 1;const wa=(a.isU?2:0)+(a.isH?1:0),wb=(b.isU?2:0)+(b.isH?1:0);if(wb!==wa)return wb-wa;if(a.task.dueDate&&b.task.dueDate)return a.task.dueDate.localeCompare(b.task.dueDate);return a.task.dueDate?-1:b.task.dueDate?1:0;});return all;}
function toggleDone(tid,e){if(e)e.stopPropagation();const r=findTask(tid);if(!r)return;r.task.status=r.task.status==='הושלם'?'פתוח':'הושלם';sv();if(S.view==='dash')rDash();else if(S.view==='proj')rMn();rSb();}
let draggedTaskId=null;
function moveTask(tid,targetAreaId,e){if(e)e.stopPropagation();closeMovePop();const r=findTask(tid);if(!r)return;if(r.area.id===targetAreaId)return;const target=r.proj.areas.find(a=>a.id===targetAreaId);if(!target)return;r.area.tasks=r.area.tasks.filter(t=>t.id!==tid);target.tasks.push(r.task);sv();render();}
function showMovePop(tid,btn,e){if(e){e.stopPropagation();e.preventDefault();}closeMovePop();const r=findTask(tid);if(!r)return;const proj=r.proj;const others=proj.areas.filter(a=>a.id!==r.area.id);if(!others.length)return;const items=others.map(a=>'<button class="move-pop-i" onclick="moveTask(\''+tid+'\',\''+a.id+'\',event)">→ '+esc(a.name)+'</button>').join('');const pop=document.createElement('div');pop.className='move-pop';pop.id='move-pop';pop.innerHTML='<div class="move-pop-h">העבר לתחום</div>'+items;document.body.appendChild(pop);const rect=btn.getBoundingClientRect();let top=rect.bottom+4;let right=window.innerWidth-rect.right;pop.style.top=top+'px';pop.style.right=right+'px';requestAnimationFrame(()=>{const pr=pop.getBoundingClientRect();if(pr.bottom>window.innerHeight-8)pop.style.top=(rect.top-pr.height-4)+'px';if(pr.left<8)pop.style.right=(window.innerWidth-pr.width-8)+'px';});setTimeout(()=>document.addEventListener('click',closeMovePop,{once:true}),0);}
function closeMovePop(){const p=document.getElementById('move-pop');if(p)p.remove();}
function dragStart(tid,e){draggedTaskId=tid;e.target.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',tid);}catch(_){}}
function dragEnd(e){draggedTaskId=null;if(e.target.classList)e.target.classList.remove('dragging');document.querySelectorAll('.tb-wrap.drop-target').forEach(el=>el.classList.remove('drop-target'));}
function dragOver(e){if(!draggedTaskId)return;e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drop-target');}
function dragLeave(e){e.currentTarget.classList.remove('drop-target');}
function dropOn(aid,e){e.preventDefault();e.currentTarget.classList.remove('drop-target');const tid=draggedTaskId||(e.dataTransfer&&e.dataTransfer.getData('text/plain'));if(tid)moveTask(tid,aid);}

function rSb(){const sb=document.getElementById('sb');const urgentActive=getUrgentTasks().filter(x=>x.isU&&x.task.status!=='הושלם').length;const activeNotes=S.notes.filter(n=>!n.done).length;const items=S.projects.map(p=>'<div class="pi'+(S.view==='proj'&&p.id===S.apid?' act':'')+'" draggable="true" onclick="selP(\''+p.id+'\')" ondragstart="projItemDragStart(\''+p.id+'\',event)" ondragend="projItemDragEnd(event)" ondragover="projDragOver(\''+p.id+'\',event)" ondragleave="projDragLeave(event)" ondrop="projDrop(\''+p.id+'\',event)" title="גרור לסידור או שחרר פתק להמרה למשימה"><span class="pi-n">'+esc(p.name)+'</span><span class="pi-c">'+ptc(p)+'</span></div>').join('');sb.innerHTML='<div class="sbh"><div class="sbh-t">אביחי משימות</div><div class="sbh-s">ניהול תשתיות אנרגיה</div></div><div class="pi'+(S.view==='dash'?' act':'')+'" onclick="selDash()" style="padding:7px 12px"><span class="pi-n" style="font-weight:600">דשבורד</span><span class="pi-c'+(urgentActive?' pi-cred':'')+'">'+(urgentActive||'★')+'</span></div><div class="pi'+(S.view==='notes'?' act':'')+'" onclick="selNotes()" style="padding:7px 12px"><span class="pi-n" style="font-weight:600">📝 פתקים מהירים</span><span class="pi-c">'+(activeNotes||'·')+'</span></div><div class="pl-sec">פרויקטים</div><div class="pl">'+(items||'<div style="padding:12px;font-size:12px;color:var(--t3);text-align:center">אין פרויקטים</div>')+'</div><div class="sbf"><button class="ai-btn" onclick="selAI()">✦ עדכון עם AI</button><button class="sbb" onclick="mNewP()">+ פרויקט חדש</button><div class="sbr"><button class="sbb" onclick="xCSV()">CSV</button><button class="sbb" onclick="xJSON()">JSON</button></div><div class="usr"><div class="av">א</div><span>אביחי אסואן</span><div class="sync-dot'+(syncOk?'':' off')+'" id="sdot" title="'+(syncOk?'מסונכרן':'לא מחובר')+'"></div></div></div>';}

function selDash(){S.view='dash';S.apid=null;S.aiProjId=null;render();}
function selAI(projId){S.aiProjId=projId||null;S.view='ai';render();}
function selNotes(){S.view='notes';render();}
function addNote(text){const t=(text||'').trim();if(!t)return;S.notes.unshift({id:uid(),text:t,content:'',done:false,created:new Date().toISOString()});sv();rNotes();rSb();}
function toggleNoteDone(id){const n=S.notes.find(x=>x.id===id);if(!n)return;n.done=!n.done;sv();rNotes();rSb();}
function dNote(id){if(!confirm('למחוק פתק?'))return;S.notes=S.notes.filter(n=>n.id!==id);expandedNotes.delete(id);sv();rNotes();rSb();}
function updNote(id,text){const n=S.notes.find(x=>x.id===id);if(!n)return;const t=(text||'').trim();if(!t){S.notes=S.notes.filter(x=>x.id!==id);expandedNotes.delete(id);sv();rNotes();rSb();return;}if(n.text===t)return;n.text=t;sv();}
function toggleNoteExpand(id){if(expandedNotes.has(id))expandedNotes.delete(id);else expandedNotes.add(id);rNotes();}
function updNoteContent(id,content){const n=S.notes.find(x=>x.id===id);if(!n)return;const c=content||'';if((n.content||'')===c)return;n.content=c;sv();}
let draggedNoteId=null;
let draggedProjId=null;
function noteDragStart(id,e){draggedNoteId=id;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','note:'+id);}catch(_){}e.target.classList.add('dragging');}
function noteDragEnd(e){draggedNoteId=null;if(e.target.classList)e.target.classList.remove('dragging');document.querySelectorAll('.pi.drop-target,.pi.drop-before,.pi.drop-after').forEach(el=>el.classList.remove('drop-target','drop-before','drop-after'));}
function projItemDragStart(pid,e){draggedProjId=pid;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','proj:'+pid);}catch(_){}e.currentTarget.classList.add('dragging');}
function projItemDragEnd(e){draggedProjId=null;if(e.currentTarget.classList)e.currentTarget.classList.remove('dragging');document.querySelectorAll('.pi.drop-target,.pi.drop-before,.pi.drop-after').forEach(el=>el.classList.remove('drop-target','drop-before','drop-after'));}
function projDragOver(pid,e){if(draggedNoteId){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drop-target');return;}if(draggedProjId&&draggedProjId!==pid){e.preventDefault();e.dataTransfer.dropEffect='move';const rect=e.currentTarget.getBoundingClientRect();const isTopHalf=(e.clientY-rect.top)<rect.height/2;e.currentTarget.classList.remove('drop-before','drop-after');e.currentTarget.classList.add(isTopHalf?'drop-before':'drop-after');}}
function projDragLeave(e){e.currentTarget.classList.remove('drop-target','drop-before','drop-after');}
function projDrop(pid,e){e.preventDefault();const target=e.currentTarget;if(draggedNoteId){target.classList.remove('drop-target');const id=draggedNoteId;const n=S.notes.find(x=>x.id===id);if(!n)return;const proj=S.projects.find(p=>p.id===pid);if(!proj||!proj.areas.length){alert('הפרויקט אינו מכיל תחומים');return;}const area=proj.areas.find(a=>a.name==='כללי')||proj.areas[0];const noteContentHtml=n.content&&n.content.trim()?esc(n.content).replace(/\n/g,'<br>'):'';area.tasks.push({id:uid(),title:n.text,content:noteContentHtml,notes:'',priority:'',importance:'',status:n.done?'הושלם':'פתוח',assigned:'',dueDate:'',inCal:false,created:new Date().toISOString()});S.notes=S.notes.filter(x=>x.id!==id);expandedNotes.delete(id);sv();render();return;}if(draggedProjId&&draggedProjId!==pid){const rect=target.getBoundingClientRect();const isTopHalf=(e.clientY-rect.top)<rect.height/2;target.classList.remove('drop-before','drop-after');const fromIdx=S.projects.findIndex(p=>p.id===draggedProjId);if(fromIdx<0)return;const[moved]=S.projects.splice(fromIdx,1);let toIdx=S.projects.findIndex(p=>p.id===pid);if(toIdx<0){S.projects.push(moved);}else{if(!isTopHalf)toIdx++;S.projects.splice(toIdx,0,moved);}sv();render();}}
function rNotes(){const mn=document.getElementById('mn');const active=S.notes.filter(n=>!n.done);const done=S.notes.filter(n=>n.done);const item=n=>{const isOpen=expandedNotes.has(n.id);const hasContent=!!(n.content&&n.content.trim());return '<div class="note'+(n.done?' done':'')+'"><div class="note-row" draggable="true" ondragstart="noteDragStart(\''+n.id+'\',event)" ondragend="noteDragEnd(event)"><button class="cb'+(n.done?' done':'')+'" onclick="toggleNoteDone(\''+n.id+'\')" title="'+(n.done?'בטל':'סמן כהושלם')+'"></button><input class="note-input" value="'+esc(n.text)+'" onblur="updNote(\''+n.id+'\',this.value)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"/><button class="note-toggle'+(isOpen?' open':'')+(hasContent?' has-text':'')+'" onclick="toggleNoteExpand(\''+n.id+'\')" title="'+(hasContent?'יש טקסט מורחב — לחץ לפתיחה':'הוסף טקסט מורחב')+'">▾</button><button class="note-x" onclick="dNote(\''+n.id+'\')" title="מחק">✕</button></div>'+(isOpen?'<div class="note-extra open"><textarea class="note-textarea" placeholder="טקסט חופשי / תוכן ארוך..." onblur="updNoteContent(\''+n.id+'\',this.value)">'+esc(n.content||'')+'</textarea></div>':'')+'</div>';};const empty=active.length===0&&done.length===0?'<div class="emp">אין פתקים<br><span style="font-size:11px">הוסף פתק למעלה.<br>גרור פתק לפרויקט בסיידבר → הופך למשימה</span></div>':'';mn.innerHTML='<div class="mnh"><div style="min-width:0"><div class="mnh-t">📝 פתקים מהירים</div><div class="mnh-s">'+active.length+' פעילים · '+S.notes.length+' סה"כ · גרור לפרויקט להמרה למשימה</div></div><button class="hb" onclick="selDash()">← דשבורד</button></div><div class="notes-add"><input id="new-note" type="text" placeholder="הוסף פתק... (Enter לשמירה)" onkeydown="if(event.key===\'Enter\'){addNote(this.value);this.value=\'\';}"/></div><div class="notes-list">'+empty+(active.length?active.map(item).join(''):'')+(done.length?'<div class="notes-sep">— הושלמו ('+done.length+') —</div>'+done.map(item).join(''):'')+'</div>';setTimeout(()=>{const i=document.getElementById('new-note');if(i)i.focus();},0);}

// AI View
function rAI(){
  const mn=document.getElementById('mn');
  const hasKey=!!getApiKey();
  if(!hasKey){
    mn.innerHTML=`<div class="ai-hd"><div><div class="mnh-t">✦ עדכון עם AI</div><div class="mnh-s">הגדר מפתח API להתחיל</div></div><button class="hb" onclick="selDash()">← חזור</button></div>
    <div class="ai-no-key">
      <div style="font-size:32px">🔑</div>
      <p>כדי להשתמש בעדכון עם AI<br>נדרש מפתח Anthropic API.<br>המפתח נשמר אצלך בלבד — לא בשרת.</p>
      <button class="bp" onclick="mSetKey()">הגדר מפתח API</button>
    </div>`;
    return;
  }
  const msgs=aiMsgs.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}${m.loading?' loading':''}" style="white-space:pre-wrap">${esc(m.content)}</div>`).join('');

  mn.innerHTML=`<div class="ai-hd"><div><div class="mnh-t">✦ עדכון עם AI</div><div class="mnh-s">${subtitle}</div></div><div style="display:flex;gap:6px"><button class="hb" onclick="mSetKey()">🔑</button><button class="hb" onclick="clearAI()">נקה</button>${backBtn}</div></div>
  <div class="ai-msgs" id="ai-msgs">${welcome}${msgs}</div>
  <div class="ai-foot">
    <textarea class="ai-text" id="ai-input" placeholder="מה לעדכן? (Enter לשליחה)" onkeydown="aiKeyDown(event)"></textarea>
    <button class="ai-send" id="ai-send-btn" onclick="sendAI()">שלח</button>
  </div>`;
  const el=document.getElementById('ai-msgs');
  if(el)el.scrollTop=el.scrollHeight;
}

async function sendAI(){
  const inp=document.getElementById('ai-input');
  const btn=document.getElementById('ai-send-btn');
  if(!inp)return;
  const msg=inp.value.trim();
  if(!msg)return;
  const key=getApiKey();
  if(!key){mSetKey();return;}

  inp.value='';
  if(btn)btn.disabled=true;

  aiMsgs.push({role:'user',content:msg});
  aiMsgs.push({role:'ai',content:'חושב...',loading:true});
  rAI();

  // Build context about current projects - INCLUDING all areas (even empty ones)
  const projSummary=S.projects.map(p=>{
    const areas=p.areas.map(a=>{
      const tasks=a.tasks.map(t=>`    - ${t.title} (${t.status}${t.priority?', '+t.priority:''}${t.importance?', '+t.importance:''})`);
      return `  תחום "${a.name}":${a.tasks.length?'\n'+tasks.join('\n'):' (ריק)'}`;
    }).join('\n');
    return `פרויקט "${p.name}":\n${areas}`;
  }).join('\n\n');

  const projCtxAI=S.aiProjId?S.projects.find(p=>p.id===S.aiProjId):null;
  const projHint=projCtxAI?`\n⚠️ חשוב: המשתמש כרגע נמצא בפרויקט "${projCtxAI.name}". אם הוא לא מציין פרויקט אחר במפורש, ההנחה היא שהוא מתכוון לפרויקט הזה.\n`:'';

  const systemPrompt=`אתה עוזר לניהול פרויקטים בתשתיות אנרגיה עבור אביחי אסואן.${projHint}

מבנה הנתונים הנוכחי (כולל תחומים ריקים):
${projSummary}

חשוב מאוד:
- השתמש תמיד בשמות הפרויקטים והתחומים בדיוק כפי שמופיעים למעלה.
- אל תמציא שמות תחומים חדשים אם כבר קיים תחום דומה בפרויקט (למשל "ביצוע" קיים בכל הפרויקטים).
- שמות תחומים מקובלים: "כללי", "ביצוע", "הזמנות רכש", "חשבונות", "אדריכלות".

תפקידך: להוסיף/לעדכן/למחוק משימות ופרויקטים בשיחה טבעית בעברית.
כשאתה מבין מה המשתמש רוצה, ענה עם פקודה אחת או יותר (אפשר כמה בבת אחת) בנוסף לטקסט קצר:

הוספת משימה:
<ACTION>{"type":"add_task","project":"שם פרויקט","area":"שם תחום","title":"כותרת","priority":"","importance":"","status":"פתוח","notes":"","assigned":"","dueDate":""}</ACTION>
priority: דחוף/בינוני/נמוך או ריק. importance: גבוהה/בינונית/נמוכה או ריק. dueDate: YYYY-MM-DD או ריק.

עדכון סטטוס:
<ACTION>{"type":"update_status","project":"שם פרויקט","taskTitle":"כותרת מדויקת","status":"הושלם"}</ACTION>
status: פתוח/בביצוע/תלוי/הושלם.

הוספת פרויקט חדש (ייווצר עם תחומים: כללי, ביצוע, הזמנות רכש, חשבונות):
<ACTION>{"type":"add_project","name":"שם הפרויקט"}</ACTION>

מחיקת משימה:
<ACTION>{"type":"delete_task","project":"שם פרויקט","taskTitle":"כותרת מדויקת"}</ACTION>

כללים:
- אם חסר מידע חיוני — שאל שאלה אחת ממוקדת לפני פעולה.
- ענה תמיד בעברית, בקצרה.`;

  const messages=aiMsgs.filter(m=>!m.loading).map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}));

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:systemPrompt,messages})
    });
    const data=await res.json();
    if(data.error){throw new Error(data.error.message);}
    const reply=data.content[0].text;

    // Remove loading message
    aiMsgs=aiMsgs.filter(m=>!m.loading);

    // Extract ALL actions (global flag supports multiple actions per reply)
    const actionMatches=[...reply.matchAll(/<ACTION>([\s\S]*?)<\/ACTION>/g)];
    let displayReply=reply.replace(/<ACTION>[\s\S]*?<\/ACTION>/g,'').trim();

    const results=[];
    const norm=s=>(s||'').toString().trim();

    for(const match of actionMatches){
      try{
        const action=JSON.parse(match[1].trim());
        if(action.type==='add_task'){
          const proj=S.projects.find(p=>norm(p.name)===norm(action.project));
          if(!proj){results.push(`❌ פרויקט "${action.project}" לא נמצא`);continue;}
          let area=proj.areas.find(a=>norm(a.name)===norm(action.area));
          let isNewArea=false;
          if(!area){area={id:uid(),name:action.area||'כללי',tasks:[]};proj.areas.push(area);isNewArea=true;}
          area.tasks.push({id:uid(),title:action.title,content:'',notes:action.notes||'',priority:action.priority||'',importance:action.importance||'',status:action.status||'פתוח',assigned:action.assigned||'',dueDate:action.dueDate||'',inCal:false,created:new Date().toISOString()});
          results.push(`✅ נוספה משימה "${action.title}" → ${proj.name} › ${area.name}${isNewArea?' (תחום חדש!)':''}`);
        } else if(action.type==='update_status'){
          const proj=S.projects.find(p=>norm(p.name)===norm(action.project));
          if(!proj){results.push(`❌ פרויקט "${action.project}" לא נמצא`);continue;}
          let found=false;
          for(const a of proj.areas){
            const t=a.tasks.find(t=>norm(t.title)===norm(action.taskTitle));
            if(t){t.status=action.status;results.push(`✅ "${action.taskTitle}" → ${action.status}`);found=true;break;}
          }
          if(!found)results.push(`❌ משימה "${action.taskTitle}" לא נמצאה ב-${proj.name}`);
        } else if(action.type==='add_project'){
          const exists=S.projects.find(p=>norm(p.name)===norm(action.name));
          if(exists){results.push(`❌ פרויקט "${action.name}" כבר קיים`);continue;}
          const id=uid();
          const defs=[{id:uid(),name:'כללי',tasks:[]},{id:uid(),name:'ביצוע',tasks:[]},{id:uid(),name:'הזמנות רכש',tasks:[]},{id:uid(),name:'חשבונות',tasks:[]}];
          S.projects.push({id,name:action.name,areas:defs});
          results.push(`✅ נוסף פרויקט "${action.name}"`);
        } else if(action.type==='delete_task'){
          const proj=S.projects.find(p=>norm(p.name)===norm(action.project));
          if(!proj){results.push(`❌ פרויקט "${action.project}" לא נמצא`);continue;}
          let found=false;
          for(const a of proj.areas){
            const idx=a.tasks.findIndex(t=>norm(t.title)===norm(action.taskTitle));
            if(idx>=0){a.tasks.splice(idx,1);results.push(`✅ נמחקה "${action.taskTitle}"`);found=true;break;}
          }
          if(!found)results.push(`❌ משימה "${action.taskTitle}" לא נמצאה`);
        } else {
          results.push(`❌ סוג פקודה לא מוכר: ${action.type}`);
        }
      }catch(e){
        results.push('❌ שגיאה בפענוח פקודה');
        console.error('Action parse error',e,match[1]);
      }
    }

    if(results.length){await sv();displayReply=(displayReply?displayReply+'\n\n':'')+results.join('\n');}

    aiMsgs.push({role:'ai',content:displayReply||'(אין תשובה)'});
  }catch(e){
    aiMsgs=aiMsgs.filter(m=>!m.loading);
    aiMsgs.push({role:'ai',content:'שגיאה: '+(e.message||'בעיה בחיבור ל-API')});
  }
  rAI();
  if(btn)btn.disabled=false;
}

v>';}).join(''):'<div class="dash-empty">אין משימות בתצוגה זו</div>';mn.innerHTML='<div class="mnh"><div style="min-width:0"><div class="mnh-t">דשבורד</div><div class="mnh-s">'+active.length+' פעילות · '+totalTasks+' סה"כ</div></div></div><div class="dash-wrap"><div class="dash-body"><div class="dash-stats"><div class="sc"><div class="sc-n">'+active.length+'</div><div class="sc-l">פעילות</div></div><div class="sc red"><div class="sc-n">'+urgent.length+'</div><div class="sc-l">דחופות</div></div><div class="sc od"><div class="sc-n">'+overdue.length+'</div><div class="sc-l">באיחור</div></div><div class="sc"><div class="sc-n">'+done.length+'</div><div class="sc-l">הושלמו</div></div></div><div class="dash-filter"><button class="fb'+(dashFilter==='active'?' on':'')+'" onclick="setFilt(\'active\')">פעיל ('+active.length+')</button><button class="fb'+(dashFilter==='all'?' on':'')+'" onclick="setFilt(\'all\')">הכל ('+all.length+')</button><button class="fb'+(dashFilter==='urgent'?' on':'')+'" onclick="setFilt(\'urgent\')">דחוף ('+urgent.length+')</button><button class="fb'+(dashFilter==='high'?' on':'')+'" onclick="setFilt(\'high\')">חשיבות גבוהה ('+active.filter(x=>x.isH).length+')</button><button class="fb'+(dashFilter==='overdue'?' on':'')+'" onclick="setFilt(\'overdue\')">באיחור ('+overdue.length+')</button><button class="fb'+(dashFilter==='done'?' on':'')+'" onclick="setFilt(\'done\')">הושלמו ('+done.length+')</button></div>'+cards+'</div></div>';}

function mNewA(){sm('<h2>תחום חדש</h2><div class="f"><label>שם</label><input id="v1" placeholder="חשבונות"/></div><div class="ma"><button class="bp" onclick="cA()">צור</button><button class="bs" onclick="cm()">ביטול</button></div>');}
function cA(){const n=document.getElementById('v1').value.trim();if(!n)return;const p=ap();if(!p)return;const id=uid();p.areas.push({id,name:n,tasks:[]});S.aaid=id;sv();cm();}
function mEditA(id){const p=ap();if(!p)return;const a=p.areas.find(x=>x.id===id);if(!a)return;sm('<h2>עריכת תחום</h2><div class="f"><label>שם</label><input id="v1" value="'+esc(a.name)+'"/></div>'+(a.tasks.length?'<div style="font-size:11px;color:var(--t3);margin-top:4px">לתחום זה '+a.tasks.length+' משימות</div>':'')+'<div class="ma"><button class="bp" onclick="sA(\''+id+'\')">שמור</button><button class="bs bd-del" onclick="dA(\''+id+'\')" '+(p.areas.length>1?'':'disabled')+'>מחק</button><button class="bs" onclick="cm()">ביטול</button></div>');}
function sA(id){const p=ap();if(!p)return;const a=p.areas.find(x=>x.id===id);if(!a)return;const n=document.getElementById('v1').value.trim();if(!n)return;a.name=n;sv();cm();}
function dA(id){const p=ap();if(!p)return;const a=p.areas.find(x=>x.id===id);if(!a||!confirm('למחוק?'))return;p.areas=p.areas.filter(x=>x.id!==id);if(S.aaid===id)S.aaid='__all__';sv();cm();}
function stripHtml(s){if(!s)return '';const d=document.createElement('div');d.innerHTML=s;return (d.textContent||'').trim();}
function getAssignees(){const set=new Set();S.projects.forEach(p=>p.areas.forEach(a=>a.tasks.forEach(t=>{if(t.assigned&&t.assigned.trim())set.add(t.assigned.trim());})));return Array.from(set).sort();}
function fmtCmd(cmd){document.execCommand(cmd,false,null);const el=document.getElementById('v2');if(el)el.focus();}
function optSel(btn){const grp=btn.parentElement;grp.querySelectorAll('.opt').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function addAssignee(){const name=prompt('שם האחראי החדש:');if(!name||!name.trim())return;const v=name.trim();const grp=document.getElementById('v7');if(!grp)return;const existing=Array.from(grp.querySelectorAll('.opt')).find(b=>b.dataset.val===v);if(existing){optSel(existing);return;}const addBtn=grp.querySelector('.opt-add');const newBtn=document.createElement('button');newBtn.type='button';newBtn.className='opt opt-bl';newBtn.dataset.val=v;newBtn.textContent=v;newBtn.onclick=function(){optSel(this);};grp.insertBefore(newBtn,addBtn);optSel(newBtn);}
function tForm(t){const cur={priority:t?.priority||'',importance:t?.importance||'',status:t?.status||'פתוח',assigned:t?.assigned||''};const mkBtns=(opts,curVal)=>opts.map(o=>'<button type="button" class="opt '+o.c+(curVal===o.v?' active':'')+'" data-val="'+esc(o.v)+'" onclick="optSel(this)">'+esc(o.l)+'</button>').join('');const prio=mkBtns([{v:'',l:'ללא',c:'opt-none'},{v:'דחוף',l:'דחוף',c:'opt-r'},{v:'בינוני',l:'בינוני',c:'opt-am'},{v:'נמוך',l:'נמוך',c:'opt-gn'}],cur.priority);const imp=mkBtns([{v:'',l:'ללא',c:'opt-none'},{v:'גבוהה',l:'↑ גבוהה',c:'opt-am'},{v:'בינונית',l:'בינונית',c:'opt-bl'},{v:'נמוכה',l:'נמוכה',c:'opt-gy'}],cur.importance);const stat=mkBtns([{v:'פתוח',l:'פתוח',c:'opt-gy'},{v:'בביצוע',l:'בביצוע',c:'opt-bl'},{v:'תלוי',l:'תלוי',c:'opt-am'},{v:'הושלם',l:'✓ הושלם',c:'opt-gn'}],cur.status);const assignees=getAssignees();const assignOpts=[{v:'',l:'ללא',c:'opt-none'}].concat(assignees.map(a=>({v:a,l:a,c:'opt-bl'})));const assign=mkBtns(assignOpts,cur.assigned);const contentHtml=t?.content||'';return '<div class="f"><label>כותרת *</label><input id="v1" value="'+esc(t?.title||'')+'" placeholder="תיאור המשימה"/></div>'+
'<div class="f"><label>תוכן / תיאור</label><div class="rt-toolbar"><button type="button" class="rt-btn" onclick="fmtCmd(\'bold\')" title="מודגש"><b>B</b></button><button type="button" class="rt-btn" onclick="fmtCmd(\'italic\')" title="נטוי"><i>I</i></button><button type="button" class="rt-btn" onclick="fmtCmd(\'underline\')" title="קו תחתון"><u>U</u></button><button type="button" class="rt-btn" onclick="fmtCmd(\'insertUnorderedList\')" title="רשימה">•</button><button type="button" class="rt-btn" onclick="fmtCmd(\'insertOrderedList\')" title="ממוספרת">1.</button><button type="button" class="rt-btn" onclick="fmtCmd(\'removeFormat\')" title="נקה עיצוב">×</button></div><div id="v2" class="rt-content" contenteditable="true" data-placeholder="כתוב תוכן ארוך כאן... (השתמש בסרגל הכלים לעיצוב)">'+contentHtml+'</div></div>'+
'<div class="f"><label>עדיפות</label><div class="opt-grp" id="v4">'+prio+'</div></div>'+
'<div class="f"><label>חשיבות</label><div class="opt-grp" id="v5">'+imp+'</div></div>'+
'<div class="f"><label>סטטוס</label><div class="opt-grp" id="v6">'+stat+'</div></div>'+
'<div class="f"><label>אחראי</label><div class="opt-grp" id="v7">'+assign+'<button type="button" class="opt opt-add" onclick="addAssignee()">+ חדש</button></div></div>'+
'<div class="f"><label>תאריך יעד</label><input type="date" id="v8" value="'+esc(t?.dueDate||'')+'"/></div>';}
function gcalSection(t){const has=t?.dueDate;return '<hr class="divider"/><div class="gcal-box"><div class="gcal-box-title">ייצוא ליומן גוגל</div><div class="gcal-note">'+(has?'לחץ לפתוח ביומן גוגל.':'הוסף תאריך יעד כדי לאפשר.')+'</div><a '+(has?'href="'+gcalUrl(t)+'" target="_blank"':'href="#" onclick="event.preventDefault()"')+' class="gcal-btn" style="'+(has?'':'opacity:.4;cursor:not-allowed')+'">פתח ביומן גוגל</a></div>';}
function mNewT(){const proj=ap();if(!proj)return;const isAllView=S.aaid==='__all__';if(!isAllView&&!aa())return;if(isAllView&&!proj.areas.length){alert('צור תחום לפני הוספת משימה');return;}let areaSel='';if(isAllView){areaSel='<div class="f"><label>תחום *</label><select id="v9">'+proj.areas.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</select></div>';}sm('<h2>משימה חדשה</h2>'+areaSel+tForm(null)+gcalSection(null)+'<div class="ma"><button class="bp" onclick="sT(\'\')">שמור</button><button class="bs" onclick="cm()">ביטול</button></div>');}
function mEditT(id){const r=findTask(id);if(!r)return;const t=r.task;sm('<h2>עריכת משימה</h2>'+tForm(t)+gcalSection(t)+'<div class="ma"><button class="bp" onclick="sT(\''+id+'\')">שמור</button><button class="bs bd-del" onclick="dTask(\''+id+'\');cm()">מחק</button><button class="bs" onclick="cm()">ביטול</button></div>');}
function sT(eid){const n=document.getElementById('v1').value.trim();if(!n)return;const proj=ap();if(!proj)return;let area,ex={};if(eid){const r=findTask(eid);if(!r)return;area=r.area;ex=r.task;}else if(S.aaid==='__all__'){const sel=document.getElementById('v9');if(!sel)return;area=proj.areas.find(a=>a.id===sel.value);}else{area=aa();}if(!area)return;const getOpt=id=>{const sel=document.querySelector('#'+id+' .opt.active');return sel?sel.dataset.val:'';};const contentEl=document.getElementById('v2');const content=contentEl?contentEl.innerHTML.trim():'';const task={id:eid||uid(),title:n,content:content,notes:ex.notes||'',priority:getOpt('v4'),importance:getOpt('v5'),status:getOpt('v6')||'פתוח',assigned:getOpt('v7'),dueDate:document.getElementById('v8').value,inCal:ex.inCal||false,created:ex.created||new Date().toISOString()};if(eid)area.tasks=area.tasks.map(t=>t.id===eid?task:t);else area.tasks.push(task);sv();cm();}
function dTask(id){if(!confirm('למחוק?'))return;for(const p of S.projects)p.areas.forEach(a=>{a.tasks=a.tasks.filter(t=>t.id!==id);});sv();render();}
function xCSV(){const p=ap();if(!p){alert('בחר פרויקט');return;}let rows=[['פרויקט','תחום','כותרת','הערות','עדיפות','חשיבות','סטטוס','אחראי','תאריך יעד']];p.areas.forEach(a=>a.tasks.forEach(t=>rows.push([p.name,a.name,t.title,t.notes,t.priority,t.importance,t.status,t.assigned,t.dueDate])));const csv=rows.map(r=>r.map(x=>'"'+(x||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');const el=document.createElement('a');el.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));el.download=p.name+'.csv';el.click();}
function xJSON(){const p=ap();if(!p){alert('בחר פרויקט');return;}const el=document.createElement('a');el.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));el.download=p.name+'.json';el.click();}
window.selP=selP;window.selA=selA;window.selDash=selDash;window.selAI=selAI;window.selNotes=selNotes;window.mNewP=mNewP;window.mEditP=mEditP;window.mNewA=mNewA;window.mEditA=mEditA;window.mNewT=mNewT;window.mEditT=mEditT;window.sT=sT;window.dTask=dTask;window.cP=cP;window.sPn=sPn;window.dP=dP;window.cA=cA;window.sA=sA;window.dA=dA;window.cm=cm;window.toggleSB=toggleSB;window.quickStatus=quickStatus;window.openFullEdit=openFullEdit;window.setFilt=setFilt;window.xCSV=xCSV;window.xJSON=xJSON;window.mSetKey=mSetKey;window.saveKey=saveKey;window.delKey=delKey;window.sendAI=sendAI;window.clearAI=clearAI;window.aiKeyDown=aiKeyDown;window.toggleDone=toggleDone;window.moveTask=moveTask;window.showMovePop=showMovePop;window.closeMovePop=closeMovePop;window.dragStart=dragStart;window.dragEnd=dragEnd;window.dragOver=dragOver;window.dragLeave=dragLeave;window.dropOn=dropOn;window.addNote=addNote;window.toggleNoteDone=toggleNoteDone;window.dNote=dNote;window.updNote=updNote;window.toggleNoteExpand=toggleNoteExpand;window.updNoteContent=updNoteContent;window.noteDragStart=noteDragStart;window.noteDragEnd=noteDragEnd;window.projItemDragStart=projItemDragStart;window.projItemDragEnd=projItemDragEnd;window.projDragOver=projDragOver;window.projDragLeave=projDragLeave;window.projDrop=projDrop;window.fmtCmd=fmtCmd;window.optSel=optSel;window.addAssignee=addAssignee;
onSnapshot(doc(db,'data','avihai'),async(snap)=>{
  if(snap.exists()){
    S.projects=snap.data().projects||[];
    S.notes=snap.data().notes||[];
    syncOk=true;
    let migrated=false;
    S.projects.forEach(p=>p.areas.forEach(a=>a.tasks.forEach(t=>{
      if(t.notes&&!t.content){
        t.content=esc(t.notes).replace(/\n/g,'<br>');
        t.notes='';
        migrated=true;
      }
    })));
    if(migrated)await sv();
  }
  else{S.projects=SEED;S.notes=[];await sv();}
  if(!S.apid&&S.projects.length){S.apid=S.projects[0].id;S.aaid='__all__';}
  render();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
