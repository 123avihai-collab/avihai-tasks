body{font-family:system-ui,-apple-system,sans-serif;direction:rtl;background:#f0ede8;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:16px}

.cal-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#1D9E75;margin-right:3px;vertical-align:middle}
.ab{padding:8px 12px;border-top:.5px solid var(--b3);flex-shrink:0}
.ai-inp{width:100%;font-size:13px;padding:7px 12px;border:.5px solid var(--b3);border-radius:var(--rm);background:var(--bg2);color:var(--t3);text-align:right;direction:rtl;cursor:pointer;outline:none}

.divider{border:none;border-top:.5px solid var(--b3);margin:.7rem 0}
.gcal-box{padding:10px 12px;border:.5px solid var(--b3);border-radius:var(--rm);background:var(--bg2)}

.sb-btn.cur.done{background:#3B6D11;border-color:#3B6D11}
.od-mark{color:#A32D2D!important;border-color:#F09595!important}
/* AI CHAT */
.ai-view{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ai-hd{padding:10px 16px;border-bottom:.5px solid var(--b3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ai-hd-t{font-size:15px;font-weight:600;color:var(--t1)}
.ai-hd-s{font-size:11px;color:var(--t2);margin-top:2px}
.ai-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:var(--rl);font-size:13px;line-height:1.5}
.msg.user{background:var(--t1);color:var(--bg1);align-self:flex-start;border-radius:var(--rl) var(--rl) var(--rl) 4px}
.msg.ai{background:var(--bg2);color:var(--t1);align-self:flex-end;border-radius:var(--rl) var(--rl) 4px var(--rl);border:.5px solid var(--b3)}
.msg.ai.loading{color:var(--t3);font-style:italic}
.ai-foot{padding:10px 12px;border-top:.5px solid var(--b3);display:flex;gap:8px;flex-shrink:0}
.ai-text{flex:1;font-size:13px;padding:8px 12px;border:.5px solid var(--b2);border-radius:var(--rm);background:var(--bg1);color:var(--t1);direction:rtl;outline:none;resize:none;height:38px;min-height:38px}
.ai-text:focus{border-color:var(--t2)}
.ai-send{font-size:13px;padding:8px 14px;border-radius:var(--rm);border:none;background:var(--t1);color:var(--bg1);cursor:pointer;flex-shrink:0}
.ai-send:hover{opacity:.85}
.ai-send:disabled{opacity:.4;cursor:not-allowed}
.ai-no-key{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:2rem;text-align:center}
.ai-no-key p{font-size:13px;color:var(--t2);line-height:1.6}
.ai-welcome{text-align:center;color:var(--t3);font-size:12px;padding:1rem 0;line-height:1.8}
@media(max-width:600px){#root{flex-direction:column;height:auto;max-height:none}#sb{width:100%;min-width:0;border-left:none;border-bottom:.5px solid var(--b3)}.pl{max-height:160px}.dash-stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function getApiKey(){return localStorage.getItem('anthropic_api_key')||'';}
function setApiKey(k){localStorage.setItem('anthropic_api_key',k);}

async function sv(){try{await setDoc(doc(db,'data','avihai'),{projects:S.projects,updated:Date.now()});syncOk=true;}catch(e){syncOk=false;}updateDot();}
function updateDot(){const d=document.getElementById('sdot');if(d){d.className='sync-dot'+(syncOk?'':' off');d.title=syncOk?'מסונכרן':'לא מחובר';}}
function render(){rSb();S.view==='dash'?rDash():S.view==='ai'?rAI():rMn();}

function getUrgentTasks(){const all=[];for(const p of S.projects)for(const a of p.areas)for(const t of a.tasks){const isU=t.priority==='דחוף',isH=t.importance==='גבוהה';if(isU||isH)all.push({task:t,proj:p,area:a,isU,isH});}all.sort((a,b)=>{if(a.task.status==='הושלם'&&b.task.status!=='הושלם')return 1;if(b.task.status==='הושלם'&&a.task.status!=='הושלם')return -1;const oa=isOverdue(a.task.dueDate)&&a.task.status!=='הושלם',ob=isOverdue(b.task.dueDate)&&b.task.status!=='הושלם';if(oa&&!ob)return -1;if(ob&&!oa)return 1;const wa=(a.isU?2:0)+(a.isH?1:0),wb=(b.isU?2:0)+(b.isH?1:0);if(wb!==wa)return wb-wa;if(a.task.dueDate&&b.task.dueDate)return a.task.dueDate.localeCompare(b.task.dueDate);return a.task.dueDate?-1:b.task.dueDate?1:0;});return all;}

function rSb(){const sb=document.getElementById('sb');const urgentActive=getUrgentTasks().filter(x=>x.isU&&x.task.status!=='הושלם').length;const items=S.projects.map(p=>'<div class="pi'+(S.view!=='dash'&&S.view!=='ai'&&p.id===S.apid?' act':'')+'" onclick="selP(\''+p.id+'\')"><span class="pi-n">'+esc(p.name)+'</span><span class="pi-c">'+ptc(p)+'</span></div>').join('');sb.innerHTML='<div class="sbh"><div class="sbh-t">אביחי משימות</div><div class="sbh-s">ניהול תשתיות אנרגיה</div></div><div class="pi'+(S.view==='dash'?' act':'')+'" onclick="selDash()" style="padding:7px 12px"><span class="pi-n" style="font-weight:600">דשבורד</span><span class="pi-c'+(urgentActive?' pi-cred':'')+'">'+( urgentActive||'★')+'</span></div><div class="pl-sec">פרויקטים</div><div class="pl">'+(items||'<div style="padding:12px;font-size:12px;color:var(--t3);text-align:center">אין פרויקטים</div>')+'</div><div class="sbf"><button class="ai-btn" onclick="selAI()">✦ עדכון עם AI</button><button class="sbb" onclick="mNewP()">+ פרויקט חדש</button><div class="sbr"><button class="sbb" onclick="xCSV()">CSV</button><button class="sbb" onclick="xJSON()">JSON</button></div><div class="usr"><div class="av">א</div><span>אביחי אסואן</span><div class="sync-dot'+(syncOk?'':' off')+'" id="sdot" title="'+(syncOk?'מסונכרן':'לא מחובר')+'"></div></div></div>';}

function selDash(){S.view='dash';S.apid=null;render();}
function selAI(){S.view='ai';render();}

// AI View
function rAI(){
  const mn=document.getElementById('mn');
  const hasKey=!!getApiKey();
  if(!hasKey){
    mn.innerHTML=`<div class="ai-hd"><div><div class="mnh-t">✦ עדכון עם AI</div><div class="mnh-s">הגדר מפתח API להתחיל</div></div><button class="hb" onclick="selDash()">← חזור</button></div>
    <div class="ai-no-key">
      <div style="font-size:32px">🔑</div>
      <p>כדי להשתמש בעדכון עם AI<br>נדרש מפתח Anthropic API.<br>המפתח נשמר אצלך בלבד — לא בשרת.</p>
      <button class="bp" onclick="mSetKey()">הגדר מפתח API</button>
    </div>`;
    return;
  }
  const msgs=aiMsgs.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}${m.loading?' loading':''}">${esc(m.content)}</div>`).join('');
  const welcome=aiMsgs.length===0?`<div class="ai-welcome">כתוב בשפה חופשית מה לעדכן<br>לדוגמה: "הוסף משימה לפרויקט 2253 להזמין מגופים"</div>`:'';
  mn.innerHTML=`<div class="ai-hd"><div><div class="mnh-t">✦ עדכון עם AI</div><div class="mnh-s">מדבר ישירות עם הפרויקטים שלך</div></div><div style="display:flex;gap:6px"><button class="hb" onclick="mSetKey()">🔑</button><button class="hb" onclick="clearAI()">נקה</button><button class="hb" onclick="selDash()">← חזור</button></div></div>
  <div class="ai-msgs" id="ai-msgs">${welcome}${msgs}</div>
  <div class="ai-foot">
    <textarea class="ai-text" id="ai-input" placeholder="מה לעדכן? (Enter לשליחה)" onkeydown="aiKeyDown(event)"></textarea>
    <button class="ai-send" id="ai-send-btn" onclick="sendAI()">שלח</button>
  </div>`;
  const el=document.getElementById('ai-msgs');
  if(el)el.scrollTop=el.scrollHeight;
}

function aiKeyDown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAI();}}

function clearAI(){aiMsgs=[];render();}

function mSetKey(){
  const cur=getApiKey();
  sm(`<h2>מפתח Anthropic API</h2>
  <div class="f"><label>המפתח נשמר במכשיר שלך בלבד — לא בשרת ולא בקוד</label>
  <input id="v1" type="password" value="${cur?'sk-...מוגדר...':''}" placeholder="sk-ant-..." autocomplete="off"/></div>
  <div style="font-size:11px;color:var(--t3);margin-bottom:8px">קבל מפתח ב: console.anthropic.com</div>
  <div class="ma"><button class="bp" onclick="saveKey()">שמור</button>${cur?'<button class="bs bd-del" onclick="delKey()">מחק מפתח</button>':''}<button class="bs" onclick="cm()">ביטול</button></div>`);
}

function saveKey(){
  const inp=document.getElementById('v1');
  const v=inp.value.trim();
  if(v&&v!=='sk-...מוגדר...'){setApiKey(v);}
  cm();
  if(S.view==='ai')rAI();
}

function delKey(){
  localStorage.removeItem('anthropic_api_key');
  cm();
  if(S.view==='ai')rAI();
}

async function sendAI(){
  const inp=document.getElementById('ai-input');
  const btn=document.getElementById('ai-send-btn');
  if(!inp)return;
  const msg=inp.value.trim();
  if(!msg)return;
  const key=getApiKey();
  if(!key){mSetKey();return;}

  inp.value='';
  if(btn)btn.disabled=true;

  aiMsgs.push({role:'user',content:msg});
  aiMsgs.push({role:'ai',content:'חושב...',loading:true});
  rAI();

  // Build context about current projects
  const projSummary=S.projects.map(p=>{
    const tasks=p.areas.flatMap(a=>a.tasks.map(t=>`[${a.name}] ${t.title} (${t.status}${t.priority?', '+t.priority:''})`));
    return `פרויקט ${p.name}:\n${tasks.length?tasks.join('\n'):'(ריק)'}`;
  }).join('\n\n');

  const systemPrompt=`אתה עוזר לניהול פרויקטים בתשתיות אנרגיה עבור אביחי אסואן.
יש לך גישה לפרויקטים הבאים:
${projSummary}

תפקידך: לעזור להוסיף, לעדכן או למחוק משימות בשיחה טבעית בעברית.
כשאתה מבין מה לעשות, ענה עם JSON בפורמט הבא בנוסף לתשובה הטקסטואלית:
<ACTION>{"type":"add_task","project":"שם פרויקט","area":"שם תחום","title":"כותרת","priority":"דחוף/בינוני/נמוך/","importance":"גבוהה/בינונית/נמוכה/","status":"פתוח","notes":"","dueDate":"YYYY-MM-DD/"}</ACTION>
או: <ACTION>{"type":"update_status","taskTitle":"כותרת המשימה","project":"שם פרויקט","status":"הושלם"}</ACTION>
אם חסר מידע — שאל שאלה אחת ממוקדת.
ענה תמיד בעברית.`;

  const messages=aiMsgs.filter(m=>!m.loading).map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}));

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:systemPrompt,messages})
    });
    const data=await res.json();
    if(data.error){throw new Error(data.error.message);}
    const reply=data.content[0].text;

    // Remove loading message
    aiMsgs=aiMsgs.filter(m=>!m.loading);

    // Extract action if present
    const actionMatch=reply.match(/<ACTION>(.*?)<\/ACTION>/s);
    let displayReply=reply.replace(/<ACTION>.*?<\/ACTION>/s,'').trim();

    if(actionMatch){
      try{
        const action=JSON.parse(actionMatch[1]);
        if(action.type==='add_task'){
          const proj=S.projects.find(p=>p.name===action.project);
          if(proj){
            let area=proj.areas.find(a=>a.name===action.area);
            if(!area){area={id:uid(),name:action.area,tasks:[]};proj.areas.push(area);}
            area.tasks.push({id:uid(),title:action.title,content:'',notes:action.notes||'',priority:action.priority||'',importance:action.importance||'',status:action.status||'פתוח',assigned:'',dueDate:action.dueDate||'',inCal:false,created:new Date().toISOString().split('T')[0]});
            await sv();
            displayReply+=' ✅ המשימה נוספה!';
          }
        } else if(action.type==='update_status'){
          const proj=S.projects.find(p=>p.name===action.project);
          if(proj){for(const a of proj.areas){const t=a.tasks.find(t=>t.title===action.taskTitle);if(t){t.status=action.status;await sv();displayReply+=' ✅ הסטטוס עודכן!';}}}
        }
      }catch(e){console.error('Action parse error',e);}
    }

    aiMsgs.push({role:'ai',content:displayReply});
  }catch(e){
    aiMsgs=aiMsgs.filter(m=>!m.loading);
    aiMsgs.push({role:'ai',content:'שגיאה: '+(e.message||'בעיה בחיבור ל-API')});
  }
  rAI();
  if(btn)btn.disabled=false;
}

function rDash(){const mn=document.getElementById('mn');const all=getUrgentTasks();const active=all.filter(x=>x.task.status!=='הושלם');const urgent=active.filter(x=>x.isU);const highOnly=active.filter(x=>!x.isU&&x.isH);const overdueCount=active.filter(x=>isOverdue(x.task.dueDate)).length;const doneCount=all.filter(x=>x.task.status==='הושלם').length;const totalTasks=S.projects.reduce((s,p)=>s+ptc(p),0);const filtered=dashFilter==='urgent'?urgent:dashFilter==='high'?highOnly:dashFilter==='done'?all.filter(x=>x.task.status==='הושלם'):all;const cards=filtered.length?filtered.map(x=>{const t=x.task;const n=t.notes?t.notes.split('\n')[0]:'';const od=isOverdue(t.dueDate)&&t.status!=='הושלם';const btns=STATUSES.map(s=>'<button class="sb-btn'+(t.status===s?' cur'+(s==='הושלם'?' done':''):'')+'" onclick="quickStatus(\''+t.id+'\',\''+s+'\')">'+s+'</button>').join('');return '<div class="dk '+(x.isU?'u':'h')+'" id="dk-'+t.id+'"><div class="dk-top" onclick="toggleSB(\''+t.id+'\')"><div class="dk-b"><div class="dk-t">'+esc(t.title)+'</div>'+(n?'<div class="dk-notes">'+esc(n)+'</div>':'')+'<div class="dk-meta">'+(x.isU?'<span class="bd r">דחוף</span>':'')+(x.isH?'<span class="bd am">↑ גבוהה</span>':'')+'<span class="bd gy'+(t.status==='הושלם'?' gn':'')+'">'+esc(t.status)+'</span>'+(t.assigned?'<span class="bd bl">'+esc(t.assigned)+'</span>':'')+'<span class="dk-proj">'+esc(x.proj.name)+' › '+esc(x.area.name)+'</span>'+(t.dueDate?'<span class="bd gy'+(od?' od-mark':'')+'">'+esc(t.dueDate)+(od?' ⚠':'')+'</span>':'')+'</div></div><button class="dk-edit-btn" onclick="event.stopPropagation();openFullEdit(\''+t.id+'\')">עריכה מלאה</button></div><div class="dk-sb" id="dsb-'+t.id+'"><span class="sb-lbl">סטטוס:</span>'+btns+'</div></div>';}).join(''):'<div class="dash-empty">אין משימות דחופות או בחשיבות גבוהה</div>';mn.innerHTML='<div class="mnh"><div style="min-width:0"><div class="mnh-t">דשבורד</div><div class="mnh-s">'+active.length+' פעילות · '+totalTasks+' סה"כ</div></div></div><div class="dash-wrap"><div class="dash-body"><div class="dash-stats"><div class="sc red"><div class="sc-n">'+urgent.length+'</div><div class="sc-l">דחופות</div></div><div class="sc"><div class="sc-n">'+highOnly.length+'</div><div class="sc-l">חשיבות גבוהה</div></div><div class="sc od"><div class="sc-n">'+overdueCount+'</div><div class="sc-l">באיחור</div></div><div class="sc"><div class="sc-n">'+doneCount+'</div><div class="sc-l">הושלמו</div></div></div><div class="dash-filter"><button class="fb'+(dashFilter==='all'?' on':'')+'" onclick="setFilt(\'all\')">הכל ('+all.length+')</button><button class="fb'+(dashFilter==='urgent'?' on':'')+'" onclick="setFilt(\'urgent\')">דחוף ('+urgent.length+')</button><button class="fb'+(dashFilter==='high'?' on':'')+'" onclick="setFilt(\'high\')">חשיבות גבוהה ('+highOnly.length+')</button><button class="fb'+(dashFilter==='done'?' on':'')+'" onclick="setFilt(\'done\')">הושלמו ('+doneCount+')</button></div>'+cards+'</div></div>';}
function toggleSB(id){const el=document.getElementById('dsb-'+id);if(el)el.classList.toggle('open');}
function quickStatus(tid,s){const r=findTask(tid);if(!r)return;r.task.status=s;sv();rDash();rSb();const el=document.getElementById('dsb-'+tid);if(el)el.classList.add('open');}

function rMn(){const mn=document.getElementById('mn');const proj=ap();if(!proj){mn.innerHTML='<div class="nop"><div>בחר פרויקט מהרשימה</div><button class="bp" onclick="mNewP()">+ פרויקט חדש</button></div>';return;}const area=aa();const tasks=area?area.tasks:[];const tabs=proj.areas.map(a=>'<div class="tb-wrap'+(a.id===S.aaid?' act':'')+'"><div class="tb" onclick="selA(\''+a.id+'\')">'+esc(a.name)+(a.tasks.length?'<span class="tb-b">'+a.tasks.length+'</span>':'')+'</div><button class="tb-edit" onclick="mEditA(\''+a.id+'\')" title="ערוך">&#9998;</button></div>').join('');const cards=tasks.map(t=>{const n=t.notes?t.notes.split('\n')[0]:'';return '<div class="tc" onclick="mEditT(\''+t.id+'\')"><div class="tc-l"><div class="tc-ic"><i></i><i></i><i></i></div><button class="tc-x" onclick="event.stopPropagation();dTask(\''+t.id+'\')">✕</button></div><div class="tc-b"><div class="tc-t">'+esc(t.title)+'</div>'+(n?'<div class="tc-notes">'+esc(n)+'</div>':'')+'<div class="tc-bds">'+(t.priority?'<span class="bd '+pc(t.priority)+'">'+esc(t.priority)+'</span>':'')+(t.importance?'<span class="bd am">↑ '+esc(t.importance)+'</span>':'')+(t.status&&t.status!=='פתוח'?'<span class="bd gy">'+esc(t.status)+'</span>':'')+(t.assigned?'<span class="bd bl">'+esc(t.assigned)+'</span>':'')+(t.dueDate?'<span class="bd gy">'+esc(t.dueDate)+(t.inCal?'<span class="cal-dot"></span>':'')+'</span>':'')+'</div></div></div>';}).join('');mn.innerHTML='<div class="mnh"><div style="min-width:0"><div class="mnh-t">'+esc(proj.name)+'</div><div class="mnh-s">'+ptc(proj)+' משימות ב-'+proj.areas.length+' תחומים</div></div><button class="hb" onclick="mEditP()">עריכת פרויקט</button></div><div class="tabs">'+tabs+'<div class="tb-add" onclick="mNewA()">+</div></div><div class="tl">'+((!area)?'<div class="emp">לחץ על תחום למעלה</div>':(cards||'<div class="emp">אין משימות<br><span style="font-size:12px">לחץ "+ הוסף משימה" למטה</span></div>'))+'</div><div class="ab"><input class="ai-inp" placeholder="+ הוסף משימה חדשה..." onfocus="this.blur();mNewT()" readonly/></div>';}
function selP(id){S.apid=id;S.view='proj';const p=S.projects.find(x=>x.id===id);if(p&&p.areas.length){if(!p.areas.find(a=>a.id===S.aaid))S.aaid=p.areas[0].id;}else S.aaid=null;render();}

function dA(id){const p=ap();if(!p)return;const a=p.areas.find(x=>x.id===id);if(!a||!confirm('למחוק?'))return;p.areas=p.areas.filter(x=>x.id!==id);if(S.aaid===id)S.aaid=p.areas[0]?.id||null;sv();cm();}
function tForm(t){return '<div class="f"><label>כותרת *</label><input id="v1" value="'+esc(t?.title||'')+'" placeholder="תיאור המשימה"/></div><div class="f"><label>תוכן / תיאור</label><textarea id="v2">'+esc(t?.content||'')+'</textarea></div><div class="f"><label>הערות</label><textarea id="v3">'+esc(t?.notes||'')+'</textarea></div><div class="fr"><div class="f"><label>עדיפות</label><select id="v4"><option value="">ללא</option>'+['דחוף','בינוני','נמוך'].map(o=>'<option '+(t?.priority===o?'selected':'')+'>'+o+'</option>').join('')+'</select></div><div class="f"><label>חשיבות</label><select id="v5"><option value="">ללא</option>'+['גבוהה','בינונית','נמוכה'].map(o=>'<option '+(t?.importance===o?'selected':'')+'>'+o+'</option>').join('')+'</select></div></div><div class="fr"><div class="f"><label>סטטוס</label><select id="v6">'+STATUSES.map(o=>'<option '+((t?.status||'פתוח')===o?'selected':'')+'>'+o+'</option>').join('')+'</select></div><div class="f"><label>אחראי</label><input id="v7" value="'+esc(t?.assigned||'')+'" placeholder="שם"/></div></div><div class="f"><label>תאריך יעד</label><input type="date" id="v8" value="'+esc(t?.dueDate||'')+'"/></div>';}
function gcalSection(t){const has=t?.dueDate;return '<hr class="divider"/><div class="gcal-box"><div class="gcal-box-title">ייצוא ליומן גוגל</div><div class="gcal-note">'+(has?'לחץ לפתוח ביומן גוגל.':'הוסף תאריך יעד כדי לאפשר.')+'</div><a '+(has?'href="'+gcalUrl(t)+'" target="_blank"':'href="#" onclick="event.preventDefault()"')+' class="gcal-btn" style="'+(has?'':'opacity:.4;cursor:not-allowed')+'">פתח ביומן גוגל</a></div>';}
function mNewT(){const a=aa();if(!a)return;sm('<h2>משימה חדשה</h2>'+tForm(null)+gcalSection(null)+'<div class="ma"><button class="bp" onclick="sT(\'\')">שמור</button><button class="bs" onclick="cm()">ביטול</button></div>');}
function mEditT(id){const r=findTask(id);if(!r)return;const t=r.task;sm('<h2>עריכת משימה</h2>'+tForm(t)+gcalSection(t)+'<div class="ma"><button class="bp" onclick="sT(\''+id+'\')">שמור</button><button class="bs bd-del" onclick="dTask(\''+id+'\');cm()">מחק</button><button class="bs" onclick="cm()">ביטול</button></div>');}
function sT(eid){const n=document.getElementById('v1').value.trim();if(!n)return;const a=aa();if(!a)return;const ex=eid?a.tasks.find(t=>t.id===eid)||{}:{};const task={id:eid||uid(),title:n,content:document.getElementById('v2').value.trim(),notes:document.getElementById('v3').value.trim(),priority:document.getElementById('v4').value,importance:document.getElementById('v5').value,status:document.getElementById('v6').value,assigned:document.getElementById('v7').value.trim(),dueDate:document.getElementById('v8').value,inCal:ex.inCal||false,created:ex.created||new Date().toISOString().split('T')[0]};if(eid)a.tasks=a.tasks.map(t=>t.id===eid?task:t);else a.tasks.push(task);sv();cm();}
function dTask(id){if(!confirm('למחוק?'))return;for(const p of S.projects)p.areas.forEach(a=>{a.tasks=a.tasks.filter(t=>t.id!==id);});sv();render();}
function xCSV(){const p=ap();if(!p){alert('בחר פרויקט');return;}let rows=[['פרויקט','תחום','כותרת','הערות','עדיפות','חשיבות','סטטוס','אחראי','תאריך יעד']];p.areas.forEach(a=>a.tasks.forEach(t=>rows.push([p.name,a.name,t.title,t.notes,t.priority,t.importance,t.status,t.assigned,t.dueDate])));const csv=rows.map(r=>r.map(x=>'"'+(x||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');const el=document.createElement('a');el.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));el.download=p.name+'.csv';el.click();}
function xJSON(){const p=ap();if(!p){alert('בחר פרויקט');return;}const el=document.createElement('a');el.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));el.download=p.name+'.json';el.click();}
window.selP=selP;window.selA=selA;window.selDash=selDash;window.selAI=selAI;window.mNewP=mNewP;window.mEditP=mEditP;window.mNewA=mNewA;window.mEditA=mEditA;window.mNewT=mNewT;window.mEditT=mEditT;window.sT=sT;window.dTask=dTask;window.cP=cP;window.sPn=sPn;window.dP=dP;window.cA=cA;window.sA=sA;window.dA=dA;window.cm=cm;window.toggleSB=toggleSB;window.quickStatus=quickStatus;window.openFullEdit=openFullEdit;window.setFilt=setFilt;window.xCSV=xCSV;window.xJSON=xJSON;window.mSetKey=mSetKey;window.saveKey=saveKey;window.delKey=delKey;window.sendAI=sendAI;window.clearAI=clearAI;window.aiKeyDown=aiKeyDown;
onSnapshot(doc(db,'data','avihai'),async(snap)=>{
  if(snap.exists()){S.projects=snap.data().projects||[];syncOk=true;}
  else{S.projects=SEED;await sv();}
  if(!S.apid&&S.projects.length){S.apid=S.projects[0].id;S.aaid=S.projects[0].areas[0]?.id||null;}
  render();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
